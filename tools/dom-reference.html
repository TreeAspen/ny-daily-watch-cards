<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../assets/fonts.css">
<!-- Faithful DOM copy of cards.py, used only to diff the canvas port against
     the original Playwright output. Not part of the tool. -->
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#444;display:flex}
.card{position:relative;width:1080px;height:1350px;background:#121212;overflow:hidden;
  -webkit-font-smoothing:antialiased}
.date{position:absolute;left:92px;bottom:66px;font:400 34px/1 'Playfair Display';color:#EADFC2}
.logo{position:absolute;right:34px;bottom:44px;width:107px;height:107px;border-radius:50%;object-fit:contain}
.photo{position:absolute;top:0;left:0;width:1080px;height:600px;overflow:hidden}
.tag{position:absolute;top:38px;left:0;height:50px;background:#EFC050;display:flex;align-items:center;
  padding:0 28px 0 92px;font:700 21px/1 'Montserrat';color:#fff;letter-spacing:.02em}
.body{position:absolute;top:636px;left:0;width:1080px;height:554px;padding:0 92px}
.hed{font-family:'Playfair Display';font-weight:700;color:#EFC050;font-size:84px;line-height:1.30}
.sub{font-family:'Montserrat';font-weight:400;color:#FFFFFF;font-size:46px;line-height:1.34;margin-top:34px}
.wrap{position:absolute;top:69px;left:92px;width:896px;height:1350px}
.eyebrow{font:400 28px/1 'Montserrat';color:#EFEAE0;letter-spacing:.02em}
.head{font-family:'Playfair Display';font-weight:700;color:#EFC050;font-size:78px;line-height:1.12;margin-top:22px}
ul{list-style:none;position:absolute;left:0;width:896px;display:flex;flex-direction:column;justify-content:flex-start}
li{display:flex;align-items:flex-start;margin-bottom:40px}
li:last-child{margin-bottom:0}
.dot{flex:0 0 24px;width:24px;height:24px;border-radius:50%;background:#EFC050;margin-right:16px;
  font-size:64px;margin-top:calc((1.33em - 24px) / 2)}
.txt{font-family:'Montserrat';font-weight:300;color:#FFFFFF;font-size:64px;line-height:1.33}
</style></head>
<body>
<div class="card" id="one">
  <div class="photo"><img id="ph" style="width:100%;height:100%;object-fit:cover"></div>
  <div class="tag" id="tag"></div>
  <div class="body"><div class="hed" id="hed"></div><div class="sub" id="sub"></div></div>
  <div class="date" id="d1"></div><img class="logo" id="l1">
</div>
<div class="card" id="two">
  <div class="wrap"><div class="eyebrow" id="eb"></div><div class="head" id="head"></div>
    <ul id="list"></ul></div>
  <div class="date" id="d2"></div><img class="logo" id="l2">
</div>
<script src="../assets/logo.js"></script>
<script type="module">
const SAMPLE = {
  category: 'Business',
  headline: 'Polysilicon: The Hidden Link Between America’s Solar and Chip Industries',
  subtitle: 'New solar tariffs, signed Aug. 6 — but the real target is chips.',
  eyebrow: 'Why chips need solar',
  heading: 'Three things to know',
  bullets: [
    "Chips use just 2.4% of the world's polysilicon. Solar uses nearly all the rest.",
    'The U.S. had ~50% of global polysilicon capacity in 2005. Under 2% by 2024.',
    'Price floors and a 15% tariff take effect Dec. 4.',
  ],
  date: 'AUGUST 12, 2026',
};
const STRESS = {
  category: 'City Government',
  headline: 'A Deliberately Overlong Headline That Has To Shrink Several Steps Before It Fits Inside The Body Column',
  subtitle: 'And a subtitle that also runs long enough to force a second shrink pass, testing that nothing collides with the date or the logo at the bottom of the card.',
  eyebrow: 'Stress test for the auto-fit',
  heading: 'A heading long enough to wrap onto two full lines',
  bullets: [
    'A first bullet that is deliberately verbose so that it wraps across several lines and pushes the shrink loop toward its minimum size.',
    'A second bullet, similarly padded out with clauses, to make sure the vertical gap logic still distributes the remaining space sensibly.',
    'A third bullet with numbers: 2.4%, ~50%, Dec. 4, and 15% tariffs stacked together.',
    'A fourth bullet, because four is more than the usual three.',
  ],
  date: 'AUGUST 16, 2026',
};
const d = new URLSearchParams(location.search).get('case') === 'stress' ? STRESS : SAMPLE;

function testPhoto() {
  const c = document.createElement('canvas'); c.width = 1600; c.height = 900;
  const x = c.getContext('2d');
  const g = x.createLinearGradient(0, 0, 1600, 900);
  g.addColorStop(0, '#3a5c7a'); g.addColorStop(0.5, '#8a6a3a'); g.addColorStop(1, '#1d2530');
  x.fillStyle = g; x.fillRect(0, 0, 1600, 900);
  x.fillStyle = 'rgba(255,255,255,.22)';
  for (let i = 0; i < 26; i++) x.fillRect(i * 62, 900 - (i * 37 % 520) - 60, 44, 900);
  return c.toDataURL('image/png');
}

ph.src = testPhoto(); l1.src = l2.src = window.NDW_LOGO;
tag.textContent = d.category; hed.textContent = d.headline; sub.textContent = d.subtitle;
d1.textContent = d2.textContent = d.date;
eb.textContent = d.eyebrow; head.textContent = d.heading;
list.innerHTML = d.bullets.map(b => `<li><span class="dot"></span><span class="txt">${b}</span></li>`).join('');

await document.fonts.ready;
await new Promise(r => setTimeout(r, 300));

// FIT_ONE
const box = 1350 - 600, minH = 52, minS = 30;
function shrink(el, min) {
  let s = parseFloat(getComputedStyle(el).fontSize);
  while (s > min && document.querySelector('.body').scrollHeight > box) {
    s -= 1; el.style.fontSize = s + 'px';
  }
  return s;
}
const i1 = { headline: shrink(hed, minH), subtitle: shrink(sub, minS) };

// FIT_TWO
(function () {
  const minB = 38, minHh = 52, maxLines = 4;
  let hs = parseFloat(getComputedStyle(head).fontSize);
  while (hs > minHh && head.scrollHeight > 190) { hs -= 1; head.style.fontSize = hs + 'px'; }
  const ul = list;
  const wrapTop = ul.offsetParent.getBoundingClientRect().top;
  const top = head.getBoundingClientRect().bottom - wrapTop + 64;
  ul.style.top = top + 'px';
  ul.style.height = (1350 - 215 - wrapTop - top) + 'px';
  const txts = [...document.querySelectorAll('.txt')];
  let bs = parseFloat(getComputedStyle(txts[0]).fontSize);
  const lines = t => Math.round(t.getBoundingClientRect().height / parseFloat(getComputedStyle(t).lineHeight));
  const bad = () => ul.scrollHeight > ul.clientHeight || txts.some(t => lines(t) > maxLines);
  while (bs > minB && bad()) { bs -= 1; txts.forEach(t => t.style.fontSize = bs + 'px'); }
  const items = [...ul.children];
  items.forEach(li => li.style.marginBottom = '0px');
  const content = items.reduce((a, li) => a + li.getBoundingClientRect().height, 0);
  const gap = Math.min(40, Math.max(28, (ul.clientHeight - content) / (items.length - 1)));
  items.forEach((li, i) => li.style.marginBottom = (i < items.length - 1 ? gap : 0) + 'px');
  document.title = 'DOM ' + JSON.stringify({ ...i1, heading: hs, bullets: bs, gap: Math.round(gap) });
})();
</script></body></html>
