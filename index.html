<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NY Daily Watch · Instagram 卡片生成器</title>
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="assets/fonts.css">
<style>
  :root{
    --ink:#121212; --panel:#1b1b1b; --line:#2e2e2e;
    --gold:#EFC050; --cream:#EADFC2; --text:#EDEDED; --dim:#9A9A9A;
    --bad:#E0655B; --ok:#7FBF7F;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--ink);color:var(--text);
    font:400 15px/1.55 'Montserrat',system-ui,'Microsoft YaHei',sans-serif;
    padding:28px clamp(16px,3vw,44px) 64px}
  h1{font:700 27px/1.2 'Playfair Display',serif;color:var(--gold)}
  header{display:flex;align-items:center;gap:14px;margin-bottom:6px}
  header img{width:44px;height:44px;border-radius:50%}
  .lede{color:var(--dim);font-size:13.5px;margin-bottom:24px}
  .lede kbd{background:#2a2a2a;border:1px solid var(--line);border-radius:4px;
    padding:1px 6px;font:600 12px/1 'Montserrat';color:var(--cream)}

  .grid{display:grid;grid-template-columns:minmax(380px,1fr) minmax(560px,1.15fr);
    gap:28px;align-items:start}
  @media (max-width:1080px){.grid{grid-template-columns:1fr}}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px}
  .panel + .panel{margin-top:18px}
  .label{font:600 12px/1 'Montserrat';letter-spacing:.08em;text-transform:uppercase;
    color:var(--dim);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}

  textarea{width:100%;min-height:340px;resize:vertical;background:#131313;color:var(--text);
    border:1px solid var(--line);border-radius:8px;padding:14px;
    font:400 13px/1.6 ui-monospace,'Cascadia Mono',Consolas,monospace;tab-size:2}
  textarea:focus{outline:none;border-color:var(--gold)}

  .drop{border:1.5px dashed #3d3d3d;border-radius:8px;min-height:132px;display:flex;
    flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;
    color:var(--dim);font-size:13px;text-align:center;padding:14px;transition:.15s;
    background-size:cover;background-position:center}
  .drop:hover,.drop.over{border-color:var(--gold);color:var(--cream)}
  .drop.has-img{border-style:solid;border-color:#3d3d3d;min-height:150px;color:transparent}
  .drop.has-img span{background:rgba(0,0,0,.62);color:#fff;padding:4px 10px;border-radius:5px}

  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .row.slider{margin-top:12px;font-size:12.5px;color:var(--dim)}
  input[type=range]{flex:1;accent-color:var(--gold)}

  button{font:600 13px/1 'Montserrat';border-radius:7px;padding:11px 16px;cursor:pointer;
    border:1px solid var(--line);background:#252525;color:var(--text);transition:.15s}
  button:hover{border-color:var(--gold);color:var(--gold)}
  button.primary{background:var(--gold);color:#1a1400;border-color:var(--gold)}
  button.primary:hover{filter:brightness(1.08);color:#1a1400}
  button.ghost{background:none;padding:8px 12px;font-weight:400;font-size:12.5px}
  button:disabled{opacity:.45;cursor:not-allowed}

  .cards{display:grid;grid-template-columns:1fr 1fr;gap:20px}
  @media (max-width:640px){.cards{grid-template-columns:1fr}}
  .card figure{background:#0d0d0d;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  canvas{display:block;width:100%;height:auto}
  .card .row{margin-top:10px}
  .card .row button{flex:1}
  .meta{font-size:11.5px;color:var(--dim);margin-top:7px;min-height:16px}
  .meta.warn{color:var(--bad)}

  #status{margin-top:14px;font-size:13px;min-height:20px}
  #status.err{color:var(--bad)}
  #status.ok{color:var(--ok)}

  details{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
  summary{cursor:pointer;font-size:12.5px;color:var(--dim)}
  summary:hover{color:var(--gold)}
  details .row{margin-top:12px}
  details p{font-size:12.5px;color:var(--dim);margin-top:10px}
  code{background:#131313;border:1px solid var(--line);border-radius:4px;padding:1px 5px;font-size:12px}
</style>
</head>
<body>
<header>
  <img id="brandmark" alt="">
  <h1>NY Daily Watch · 卡片生成器</h1>
</header>
<p class="lede">
  把整条新闻的 JSON 粘进左边 → 在任意位置按 <kbd>Ctrl</kbd>+<kbd>V</kbd> 贴上标题图 → 右边两张
  1080×1350 卡片实时更新，可直接下载或复制。
</p>

<div class="grid">
  <div>
    <div class="panel">
      <div class="label">
        <span>1 · 新闻 JSON</span>
        <span class="row">
          <button class="ghost" id="btn-prompt">复制 AI 提示词</button>
          <button class="ghost" id="btn-sample">载入示例</button>
        </span>
      </div>
      <textarea id="json" spellcheck="false" placeholder="在这里粘贴 JSON…"></textarea>
    </div>

    <div class="panel">
      <div class="label"><span>2 · 标题图</span><span class="row">
        <button class="ghost" id="btn-clear-img">移除</button></span></div>
      <div class="drop" id="drop" tabindex="0">
        <strong>点击选择 / 拖入 / Ctrl+V 粘贴</strong>
        <span>裁成 1080×600 顶部图；不放图则留灰底</span>
      </div>
      <input type="file" id="file" accept="image/*" hidden>
      <div class="row slider">
        <label for="focus">纵向裁切</label>
        <input type="range" id="focus" min="0" max="100" value="50">
        <span id="focus-val">居中</span>
      </div>
    </div>

    <div class="panel">
      <div class="label"><span>3 · 导出</span></div>
      <div class="row">
        <button class="primary" id="btn-download">⬇ 一键下载两张 PNG</button>
      </div>
      <div id="status"></div>

      <details>
        <summary>高级设置</summary>
        <div class="row">
          <button class="ghost" id="btn-logo">更换 logo</button>
          <button class="ghost" id="btn-logo-reset">恢复默认 logo</button>
          <input type="file" id="logofile" accept="image/*" hidden>
        </div>
        <p>字段：<code>category</code> <code>headline</code> <code>subtitle</code>
          <code>eyebrow</code> <code>heading</code> <code>bullets[]</code>
          <code>date</code> <code>slug</code>。多余字段会被忽略，缺字段按空处理。</p>
      </details>
    </div>
  </div>

  <div class="cards">
    <div class="card">
      <figure><canvas id="c1"></canvas></figure>
      <div class="row"><button data-copy="1">复制卡片 1</button></div>
      <div class="meta" id="m1"></div>
    </div>
    <div class="card">
      <figure><canvas id="c2"></canvas></figure>
      <div class="row"><button data-copy="2">复制卡片 2</button></div>
      <div class="meta" id="m2"></div>
    </div>
  </div>
</div>

<script src="assets/logo.js"></script>
<script type="module">
import { renderPhotoCard, renderDarkCard, FONT_SPECS, loadImage } from './assets/render.js';

const $ = (id) => document.getElementById(id);
const ta = $('json'), c1 = $('c1'), c2 = $('c2');
const STORE = 'ndw-cards-json';

const SAMPLE = {
  slug: 'polysilicon-solar-chips',
  category: 'Business',
  headline: 'Polysilicon: The Hidden Link Between America’s Solar and Chip Industries',
  subtitle: 'New solar tariffs, signed Aug. 6 — but the real target is chips.',
  eyebrow: 'Why chips need solar',
  heading: 'Three things to know',
  bullets: [
    "Chips use just 2.4% of the world's polysilicon. Solar uses nearly all the rest.",
    'The U.S. had ~50% of global polysilicon capacity in 2005. Under 2% by 2024.',
    'Price floors and a 15% tariff take effect Dec. 4.',
  ],
  date: 'AUGUST 12, 2026',
};

const PROMPT = `把这条新闻整理成 NY Daily Watch 的 Instagram 双卡文案，只输出 JSON，不要任何解释或代码块标记：

{
  "slug": "英文短横线 slug，用于文件名",
  "category": "栏目名，1-2 个词，如 Business / Politics / City",
  "headline": "卡片1主标题，英文，12 词以内，不要句号",
  "subtitle": "卡片1副标题，一句话，25 词以内",
  "eyebrow": "卡片2顶部小字，4-6 个词的角度提示",
  "heading": "卡片2大标题，如 Three things to know",
  "bullets": ["要点1", "要点2", "要点3"],
  "date": "MONTH D, YYYY 全大写"
}

要求：bullets 三条，每条 20 词以内、可独立成立、带具体数字或日期；全部用英文。

新闻原文：
<在这里粘贴新闻>`;

let photoImg = null, logoImg = null, data = null;
let lastGood = null;

/* ---- input parsing ------------------------------------------------- */
function parseJSON(raw) {
  let s = raw.trim();
  if (!s) return null;
  s = s.replace(/^```(?:json)?\s*/i, '').replace(/```\s*$/, '').trim();
  const open = s.indexOf('{'), close = s.lastIndexOf('}');
  if (open > 0 || (close !== -1 && close < s.length - 1)) {
    if (open !== -1 && close > open) s = s.slice(open, close + 1);
  }
  try { return JSON.parse(s); }
  catch (e) {
    // Trailing commas are the one thing LLM output gets wrong often enough to fix.
    try { return JSON.parse(s.replace(/,\s*([}\]])/g, '$1')); }
    catch (_) { throw e; }
  }
}

function normalize(o) {
  const d = { ...o };
  if (typeof d.bullets === 'string') d.bullets = d.bullets.split('\n');
  if (!Array.isArray(d.bullets)) d.bullets = [];
  d.bullets = d.bullets.map((b) => String(b).replace(/^[-•*]\s*/, '').trim()).filter(Boolean);
  for (const k of ['category', 'headline', 'subtitle', 'eyebrow', 'heading', 'date', 'slug']) {
    if (d[k] != null) d[k] = String(d[k]).trim();
  }
  return d;
}

const slugify = (s) =>
  String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 48) || 'card';

/* ---- render -------------------------------------------------------- */
let fontsReady = false;
async function ensureFonts() {
  if (fontsReady) return;
  await Promise.all(FONT_SPECS.map((s) => document.fonts.load(s, 'Ag')));
  await document.fonts.ready;
  fontsReady = true;
}

function setStatus(msg, cls = '') { const el = $('status'); el.textContent = msg; el.className = cls; }

async function draw() {
  await ensureFonts();
  const raw = ta.value;
  localStorage.setItem(STORE, raw);

  if (!raw.trim()) { data = null; setStatus('等待 JSON…'); blank(); return; }
  try {
    data = normalize(parseJSON(raw));
  } catch (e) {
    setStatus('JSON 解析失败：' + e.message + (lastGood ? '（下面仍显示上一次成功的内容）' : ''), 'err');
    if (!lastGood) { blank(); return; }
    data = lastGood;
    paint();
    return;
  }
  lastGood = data;
  setStatus('已就绪 · ' + (data.slug || slugify(data.headline)), 'ok');
  paint();
}

function blank() {
  data = null;
  for (const c of [c1, c2]) {
    const ctx = c.getContext('2d');
    c.width = 1080; c.height = 1350;
    ctx.fillStyle = '#121212'; ctx.fillRect(0, 0, 1080, 1350);
  }
  $('m1').textContent = $('m2').textContent = '';
  $('btn-download').disabled = true;
}

function paint() {
  const focus = +$('focus').value / 100;
  const i1 = renderPhotoCard(c1, data, { photo: photoImg, logo: logoImg, focus });
  const i2 = renderDarkCard(c2, data, { logo: logoImg });
  $('m1').textContent = `标题 ${i1.headline}px · 副标 ${i1.subtitle}px` +
    (i1.overflow ? ' · 已到最小字号仍溢出，请缩短文字' : '');
  $('m1').className = 'meta' + (i1.overflow ? ' warn' : '');
  $('m2').textContent = `大标 ${i2.heading}px · 要点 ${i2.bullets}px` +
    (i2.overflow ? ` · 有要点占 ${i2.longest} 行，请缩短` : '');
  $('m2').className = 'meta' + (i2.overflow ? ' warn' : '');
  $('btn-download').disabled = false;
}

let timer;
ta.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(draw, 180); });
$('focus').addEventListener('input', () => {
  const v = +$('focus').value;
  $('focus-val').textContent = v === 50 ? '居中' : (v < 50 ? `上移 ${50 - v}%` : `下移 ${v - 50}%`);
  if (data) paint();
});

/* ---- image intake -------------------------------------------------- */
async function useImage(blobOrFile) {
  if (!blobOrFile || !blobOrFile.type.startsWith('image/')) return;
  const url = URL.createObjectURL(blobOrFile);
  try {
    photoImg = await loadImage(url);
    const d = $('drop');
    d.classList.add('has-img');
    d.style.backgroundImage = `url(${url})`;
    d.innerHTML = `<span>${photoImg.width}×${photoImg.height} · 再贴一张即可替换</span>`;
    if (data) paint();
  } catch (_) { setStatus('图片读取失败', 'err'); }
}

function clearImage() {
  photoImg = null;
  const d = $('drop');
  d.classList.remove('has-img');
  d.style.backgroundImage = '';
  d.innerHTML = '<strong>点击选择 / 拖入 / Ctrl+V 粘贴</strong>' +
    '<span>裁成 1080×600 顶部图；不放图则留灰底</span>';
  if (data) paint();
}

$('drop').addEventListener('click', () => $('file').click());
$('drop').addEventListener('dragover', (e) => { e.preventDefault(); $('drop').classList.add('over'); });
$('drop').addEventListener('dragleave', () => $('drop').classList.remove('over'));
$('drop').addEventListener('drop', (e) => {
  e.preventDefault(); $('drop').classList.remove('over');
  useImage(e.dataTransfer.files[0]);
});
$('file').addEventListener('change', (e) => useImage(e.target.files[0]));
$('btn-clear-img').addEventListener('click', clearImage);

// Paste anywhere — including inside the JSON box, where an image paste carries
// no text and so must not be treated as JSON input.
window.addEventListener('paste', (e) => {
  const item = [...(e.clipboardData?.items || [])].find((i) => i.type.startsWith('image/'));
  if (item) { e.preventDefault(); useImage(item.getAsFile()); }
});

/* ---- export -------------------------------------------------------- */
const toBlob = (canvas) => new Promise((res) => canvas.toBlob(res, 'image/png'));

async function downloadBoth() {
  const slug = data.slug || slugify(data.headline);
  const jobs = [[c1, `${slug}-1-photo.png`], [c2, `${slug}-2-dark.png`]];
  for (const [canvas, name] of jobs) {
    const blob = await toBlob(canvas);
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    await new Promise((r) => setTimeout(r, 350));
  }
  setStatus(`已下载 ${slug}-1-photo.png 和 ${slug}-2-dark.png`, 'ok');
}

$('btn-download').addEventListener('click', () => {
  if (!data) return;
  downloadBoth().catch((e) => setStatus('下载失败：' + e.message, 'err'));
});

document.querySelectorAll('[data-copy]').forEach((btn) => {
  btn.addEventListener('click', async () => {
    const canvas = btn.dataset.copy === '1' ? c1 : c2;
    const old = btn.textContent;
    try {
      if (!navigator.clipboard?.write) throw new Error('浏览器不支持写入剪贴板');
      await navigator.clipboard.write([new ClipboardItem({ 'image/png': await toBlob(canvas) })]);
      btn.textContent = '✓ 已复制';
      setTimeout(() => (btn.textContent = old), 1400);
    } catch (e) {
      setStatus('复制失败：' + e.message + '（需在 https 或 localhost 下打开）', 'err');
    }
  });
});

async function copyText(text, btn) {
  const old = btn.textContent;
  try {
    await navigator.clipboard.writeText(text);
    btn.textContent = '✓ 已复制';
    setTimeout(() => (btn.textContent = old), 1400);
  } catch (_) { setStatus('复制失败，请手动选中复制', 'err'); }
}
$('btn-prompt').addEventListener('click', (e) => copyText(PROMPT, e.target));
$('btn-sample').addEventListener('click', () => {
  ta.value = JSON.stringify(SAMPLE, null, 2);
  draw();
});

/* ---- logo ---------------------------------------------------------- */
$('btn-logo').addEventListener('click', () => $('logofile').click());
$('logofile').addEventListener('change', async (e) => {
  const f = e.target.files[0];
  if (!f) return;
  logoImg = await loadImage(URL.createObjectURL(f));
  if (data) paint();
});
$('btn-logo-reset').addEventListener('click', async () => {
  logoImg = await loadImage(window.NDW_LOGO);
  if (data) paint();
});

/* ---- boot ---------------------------------------------------------- */
(async () => {
  $('brandmark').src = window.NDW_LOGO;
  logoImg = await loadImage(window.NDW_LOGO);
  ta.value = localStorage.getItem(STORE) || '';
  if (new URLSearchParams(location.search).has('demo')) ta.value = JSON.stringify(SAMPLE, null, 2);
  blank();
  await draw();
  ta.focus();
})();
</script>
</body>
</html>
