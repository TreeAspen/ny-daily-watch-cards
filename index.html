<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NY Daily Watch · Card Generator</title>
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="assets/fonts.css">
<style>
  :root{
    --ink:#121212; --panel:#1b1b1b; --line:#2e2e2e;
    --gold:#EFC050; --cream:#EADFC2; --text:#EDEDED; --dim:#9A9A9A;
    --bad:#E0655B; --ok:#7FBF7F;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--ink);color:var(--text);
    font:400 15px/1.55 'Montserrat',system-ui,'Microsoft YaHei',sans-serif;
    padding:28px clamp(16px,3vw,44px) 64px}
  h1{font:700 27px/1.2 'Playfair Display',serif;color:var(--gold)}
  header{display:flex;align-items:center;gap:14px;margin-bottom:6px}
  header img{width:44px;height:44px;border-radius:50%}
  .langs{margin-left:auto;display:flex;gap:6px}
  .langs button{padding:7px 13px;font-size:12.5px}
  .langs button[aria-pressed=true]{border-color:var(--gold);color:var(--gold);background:#2b2416}
  .lede{color:var(--dim);font-size:13.5px;margin-bottom:24px}
  .lede kbd{background:#2a2a2a;border:1px solid var(--line);border-radius:4px;
    padding:1px 6px;font:600 12px/1 'Montserrat';color:var(--cream)}

  .grid{display:grid;grid-template-columns:minmax(380px,1fr) minmax(560px,1.15fr);
    gap:28px;align-items:start}
  @media (max-width:1080px){.grid{grid-template-columns:1fr}}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px}
  .panel + .panel{margin-top:18px}
  .label{font:600 12px/1 'Montserrat';letter-spacing:.08em;text-transform:uppercase;
    color:var(--dim);margin-bottom:10px;display:flex;justify-content:space-between;
    align-items:center;gap:12px}

  textarea{width:100%;resize:vertical;background:#131313;color:var(--text);
    border:1px solid var(--line);border-radius:8px;padding:14px;
    font:400 13px/1.6 ui-monospace,'Cascadia Mono',Consolas,monospace;tab-size:2}
  textarea:focus{outline:none;border-color:var(--gold)}
  #json{min-height:340px}
  #caption{min-height:300px;font-family:'Montserrat',system-ui,sans-serif;
    font-size:13.5px;line-height:1.62;white-space:pre-wrap}

  .drop{border:1.5px dashed #3d3d3d;border-radius:8px;min-height:132px;display:flex;
    flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;
    color:var(--dim);font-size:13px;text-align:center;padding:14px;transition:.15s;
    background-size:cover;background-position:center}
  .drop:hover,.drop.over{border-color:var(--gold);color:var(--cream)}
  .drop.has-img{border-style:solid;border-color:#3d3d3d;min-height:150px;color:transparent}
  .drop.has-img span{background:rgba(0,0,0,.62);color:#fff;padding:4px 10px;border-radius:5px}

  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .row.slider{margin-top:12px;font-size:12.5px;color:var(--dim)}
  input[type=range]{flex:1;accent-color:var(--gold)}

  button{font:600 13px/1 'Montserrat';border-radius:7px;padding:11px 16px;cursor:pointer;
    border:1px solid var(--line);background:#252525;color:var(--text);transition:.15s}
  button:hover{border-color:var(--gold);color:var(--gold)}
  button.primary{background:var(--gold);color:#1a1400;border-color:var(--gold)}
  button.primary:hover{filter:brightness(1.08);color:#1a1400}
  button.ghost{background:none;padding:8px 12px;font-weight:400;font-size:12.5px}
  button:disabled{opacity:.45;cursor:not-allowed}

  .cards{display:grid;grid-template-columns:1fr 1fr;gap:20px}
  @media (max-width:640px){.cards{grid-template-columns:1fr}}
  .card figure{background:#0d0d0d;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  canvas{display:block;width:100%;height:auto}
  .card .row{margin-top:10px}
  .card .row button{flex:1}
  .meta{font-size:11.5px;color:var(--dim);margin-top:7px;min-height:16px}
  .meta.warn{color:var(--bad)}

  #status{margin-top:14px;font-size:13px;min-height:20px}
  #status.err{color:var(--bad)}
  #status.ok{color:var(--ok)}

  #count{font:600 12px/1 'Montserrat';color:var(--dim)}
  #count.over{color:var(--bad)}
  #lint{margin-top:10px;font-size:12.5px;color:var(--bad);display:flex;
    flex-direction:column;gap:4px}
  #lint:empty{margin:0}

  details{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
  summary{cursor:pointer;font-size:12.5px;color:var(--dim)}
  summary:hover{color:var(--gold)}
  details .row{margin-top:12px}
  details p{font-size:12.5px;color:var(--dim);margin-top:10px}
  code{background:#131313;border:1px solid var(--line);border-radius:4px;padding:1px 5px;font-size:12px}
</style>
</head>
<body>
<header>
  <img id="brandmark" alt="">
  <h1 data-i18n="appTitle"></h1>
  <div class="langs">
    <button id="lang-en" data-lang="en">English</button>
    <button id="lang-zh" data-lang="zh">中文</button>
  </div>
</header>
<p class="lede" data-i18n-html="lede"></p>

<div class="grid">
  <div>
    <div class="panel">
      <div class="label">
        <span data-i18n="step1"></span>
        <span class="row">
          <button class="ghost" id="btn-prompt" data-i18n="btnPrompt"></button>
          <button class="ghost" id="btn-sample" data-i18n="btnSample"></button>
        </span>
      </div>
      <textarea id="json" spellcheck="false"></textarea>
    </div>

    <div class="panel">
      <div class="label"><span data-i18n="step2"></span><span class="row">
        <button class="ghost" id="btn-clear-img" data-i18n="btnClearImg"></button></span></div>
      <div class="drop" id="drop" tabindex="0"></div>
      <input type="file" id="file" accept="image/*" hidden>
      <div class="row slider">
        <label for="focus" data-i18n="focusLabel"></label>
        <input type="range" id="focus" min="0" max="100" value="50">
        <span id="focus-val"></span>
      </div>
    </div>

    <div class="panel">
      <div class="label"><span data-i18n="step3"></span></div>
      <div class="row">
        <button class="primary" id="btn-download" data-i18n="btnDownload"></button>
      </div>
      <div id="status"></div>

      <details>
        <summary data-i18n="advanced"></summary>
        <div class="row">
          <button class="ghost" id="btn-logo" data-i18n="btnLogo"></button>
          <button class="ghost" id="btn-logo-reset" data-i18n="btnLogoReset"></button>
          <input type="file" id="logofile" accept="image/*" hidden>
        </div>
        <p data-i18n-html="fieldsNote"></p>
      </details>
    </div>
  </div>

  <div>
    <div class="cards">
      <div class="card">
        <figure><canvas id="c1"></canvas></figure>
        <div class="row"><button data-copy="1" data-i18n="copyCard1"></button></div>
        <div class="meta" id="m1"></div>
      </div>
      <div class="card">
        <figure><canvas id="c2"></canvas></figure>
        <div class="row"><button data-copy="2" data-i18n="copyCard2"></button></div>
        <div class="meta" id="m2"></div>
      </div>
    </div>

    <div class="panel" style="margin-top:20px">
      <div class="label">
        <span data-i18n="captionTitle"></span>
        <span class="row"><span id="count"></span>
          <button class="ghost" id="btn-caption" data-i18n="btnCopyCaption"></button></span>
      </div>
      <textarea id="caption" spellcheck="false"></textarea>
      <div id="lint"></div>
    </div>
  </div>
</div>

<script src="assets/logo.js"></script>
<script type="module">
import { renderPhotoCard, renderDarkCard, FONT_SPECS, loadImage } from './assets/render.js';

const $ = (id) => document.getElementById(id);
const ta = $('json'), cap = $('caption'), c1 = $('c1'), c2 = $('c2');
const STORE = 'ndw-cards-json', LANG_STORE = 'ndw-cards-lang';
const CAP_LIMIT = 2200;
const SIGNOFF = "Read more at @theNYdailywatch 's bio.";

/* ---- strings ------------------------------------------------------- */
const STR = {
  en: {
    appTitle: 'NY Daily Watch · Card Generator',
    lede: 'Paste the whole story as JSON on the left → press <kbd>Ctrl</kbd>+<kbd>V</kbd> anywhere to drop in the cover photo → both 1080×1350 cards render live, ready to download or copy. The caption comes out of the same paste.',

    meta1over: ' · still overflowing at the minimum size, shorten the text',

    meta2over: (n) => ` · one bullet runs ${n} lines, shorten it`,

    ready: (slug) => `Ready · ${slug}`,
    parseErr: (m) => `JSON did not parse: ${m}`,
    parseErrKept: (m) => `JSON did not parse: ${m} (showing the last good version)`,
    downloaded: (a, b) => `Downloaded ${a} and ${b}`,
    downloadFail: (m) => `Download failed: ${m}`,
    copyFail: (m) => `Copy failed: ${m} (needs https or localhost)`,
    copyTextFail: 'Copy failed — select the text and copy manually',
    imgFail: 'That image could not be read',
    noClipboard: 'this browser cannot write images to the clipboard',
    chars: (n) => `${n.toLocaleString('en-US')} / 2,200`,
    lintLong: (n) => `${(n - CAP_LIMIT).toLocaleString('en-US')} characters over the 2,200 limit.`,
    lintSignoff: `Missing the exact sign-off line: ${SIGNOFF}`,
    lintPhoto: 'Missing the final "Photo: …" credit line.',
    lintHash: 'Contains a hashtag — the caption format allows none.',
    lintMarketing: (w) => `Marketing wording to cut: ${w}`,
    lintParas: (n) => `Body runs ${n} paragraphs; the format asks for an opening line plus 4–6.`,
  },
  zh: {
    appTitle: 'NY Daily Watch · 卡片生成器',
    lede: '把整条新闻的 JSON 粘进左边 → 在任意位置按 <kbd>Ctrl</kbd>+<kbd>V</kbd> 贴上标题图 → 右边两张 1080×1350 卡片实时更新，可直接下载或复制。caption 从同一次粘贴里提取。',
    step1: '1 · 新闻 JSON',
    btnPrompt: '复制 AI 提示词',
    btnSample: '载入示例',
    jsonPlaceholder: '在这里粘贴 JSON…',
    step2: '2 · 标题图',
    btnClearImg: '移除',
    dropMain: '点击选择 / 拖入 / Ctrl+V 粘贴',
    dropSub: '裁成 1080×600 顶部图；不放图则留灰底',
    dropLoaded: (w, h) => `${w}×${h} · 再贴一张即可替换`,
    focusLabel: '纵向裁切',
    focusCentre: '居中',
    focusUp: (n) => `上移 ${n}%`,
    focusDown: (n) => `下移 ${n}%`,
    step3: '3 · 导出',
    btnDownload: '⬇ 一键下载两张 PNG',
    advanced: '高级设置',
    btnLogo: '更换 logo',
    btnLogoReset: '恢复默认 logo',
    fieldsNote: '字段：<code>category</code> <code>headline</code> <code>subtitle</code> <code>eyebrow</code> <code>heading</code> <code>bullets[]</code> <code>caption</code> <code>date</code> <code>slug</code>。多余字段忽略，缺字段按空处理。',
    copyCard1: '复制卡片 1',
    copyCard2: '复制卡片 2',
    captionTitle: 'Caption 正文',
    btnCopyCaption: '复制 caption',
    captionPlaceholder: '粘贴的 JSON 里的 caption 字段会显示在这里，可直接编辑。',
    copied: '✓ 已复制',
    meta1: (h, s) => `标题 ${h}px · 副标 ${s}px`,
    meta1over: ' · 已到最小字号仍溢出，请缩短文字',
    meta2: (h, b) => `大标 ${h}px · 要点 ${b}px`,
    meta2over: (n) => ` · 有要点占 ${n} 行，请缩短`,
    waiting: '等待 JSON…',
    ready: (slug) => `已就绪 · ${slug}`,
    parseErr: (m) => `JSON 解析失败：${m}`,
    parseErrKept: (m) => `JSON 解析失败：${m}（下面仍显示上一次成功的内容）`,

    downloadFail: (m) => `下载失败：${m}`,
    copyFail: (m) => `复制失败：${m}（需在 https 或 localhost 下打开）`,
    copyTextFail: '复制失败，请手动选中复制',
    imgFail: '图片读取失败',
    noClipboard: '当前浏览器不支持写入图片到剪贴板',
    chars: (n) => `${n.toLocaleString('en-US')} / 2,200`,
    lintLong: (n) => `超出 2,200 字符上限 ${(n - CAP_LIMIT).toLocaleString('en-US')} 个。`,
    lintSignoff: `缺少结尾固定句：${SIGNOFF}`,
    lintPhoto: '缺少最后一行 "Photo: …" 图片来源。',
    lintHash: '含有 hashtag——该格式不允许。',
    lintMarketing: (w) => `需要删掉的营销用词：${w}`,
    lintParas: (n) => `正文 ${n} 段；格式要求开场句之后 4–6 段。`,
  },
};

let lang = localStorage.getItem(LANG_STORE) || 'en';
const t = (k, ...a) => { const v = STR[lang][k]; return typeof v === 'function' ? v(...a) : v; };

/* ---- data ---------------------------------------------------------- */
const SAMPLE = {
  slug: 'polysilicon-solar-chips',
  category: 'Business',
  headline: 'Polysilicon: The Hidden Link Between America’s Solar and Chip Industries',
  subtitle: 'New solar tariffs, signed Aug. 6 — but the real target is chips.',
  eyebrow: 'Why chips need solar',
  heading: 'Three things to know',
  bullets: [
    "Chips use just 2.4% of the world's polysilicon. Solar uses nearly all the rest.",
    'The U.S. had ~50% of global polysilicon capacity in 2005. Under 2% by 2024.',
    'Price floors and a 15% tariff take effect Dec. 4.',
  ],
  date: 'AUGUST 12, 2026',
  caption: `The tariffs signed on Aug. 6 are written as a solar policy. The industry they are built to rescue makes semiconductors.

Polysilicon is the shared input. Solar panels take nearly all of it; chipmakers take about 2.4% of world output, at a purity solar does not need. The same furnaces and the same trained crews serve both, which is why a plant that loses its solar orders cannot simply switch to the chip market and survive on it.

The United States held roughly half of global polysilicon capacity in 2005. By 2024 it was under 2%, after Chinese producers scaled up and prices fell below Western production costs.

The order sets a price floor and a 15% tariff, both taking effect Dec. 4. The Commerce Department frames it as rebuilding a supply chain the CHIPS Act left untouched.

Solar installers say the floor raises panel costs at the moment utility demand is climbing, and that the domestic polysilicon it protects would take years to reach the volumes chipmakers actually need.

What is unsettled is whether a price floor can hold capacity in place long enough for that to happen, or whether it only raises the cost of the panels the country is still buying from abroad.

Read more at @theNYdailywatch 's bio.

Photo: NY Daily Watch`,
};

const PROMPT = `Turn this news story into a NY Daily Watch Instagram post. Output JSON only — no explanation, no code fences:

{
  "slug": "short-hyphenated-english-slug-for-filenames",
  "category": "the first one or two words of the story pasted below, copied verbatim",
  "headline": "card 1 headline, English, under 12 words, no full stop",
  "subtitle": "card 1 subtitle, one sentence, under 25 words",
  "eyebrow": "card 2 top line, a 4-6 word angle cue",
  "heading": "card 2 headline, e.g. Three things to know",
  "bullets": ["point 1", "point 2", "point 3"],
  "date": "MONTH D, YYYY in caps",
  "caption": "Instagram caption — see the rules below"
}

Cards: exactly three bullets, each under 20 words, each able to stand alone, each carrying a specific number or date. All card text in English.

Caption rules:
- Open with a single line as its own paragraph — the only text above the fold. The best opener sounds like one thing and turns out to be another. If the reporting holds no such reversal, write a strong direct opener instead; never manufacture one.
- Then 4-6 short paragraphs: the mechanism, the numbers, who said what, and the counterargument or what is still unsettled. Name the agency or the company, not "officials."
- Include dates if the story is time-sensitive.
- End with exactly this line: ${SIGNOFF}
- Then a final line: Photo: [credit from the article, otherwise NY Daily Watch]
- Under 2,200 characters. Plain declarative sentences. No marketing words (unlock, dive into, game-changing). No hashtags. Never invent a quote.

Separate caption paragraphs with \\n\\n inside the JSON string.

Story:
<paste the article here>`;

const MARKETING = ['unlock', 'dive into', 'game-changing', 'game changer', 'deep dive',
  'revolutionary', 'seamless', 'cutting-edge', 'must-see', 'buckle up', 'let that sink in',
  'you won\'t believe', 'here\'s the kicker'];

let photoImg = null, logoImg = null, data = null, lastGood = null;
let captionFromJSON = null;          // last caption the JSON supplied, to protect edits
let statusState = { key: 'waiting', args: [], cls: '' };

/* ---- i18n application ---------------------------------------------- */
function applyLang() {
  document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
  document.title = t('appTitle');
  document.querySelectorAll('[data-i18n]').forEach((el) => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-html]').forEach((el) => { el.innerHTML = t(el.dataset.i18nHtml); });
  ta.placeholder = t('jsonPlaceholder');
  cap.placeholder = t('captionPlaceholder');
  document.querySelectorAll('[data-lang]').forEach((b) =>
    b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
  if (!photoImg) drawDropEmpty(); else drawDropLoaded();
  setFocusLabel();
  setStatus(statusState.key, statusState.cls, ...statusState.args);
  if (data) paintMeta();
  refreshCaptionUI();
}

document.querySelectorAll('[data-lang]').forEach((b) => b.addEventListener('click', () => {
  lang = b.dataset.lang;
  localStorage.setItem(LANG_STORE, lang);
  applyLang();
}));

/* ---- input parsing ------------------------------------------------- */
function parseJSON(raw) {
  let s = raw.trim();
  if (!s) return null;
  s = s.replace(/^```(?:json)?\s*/i, '').replace(/```\s*$/, '').trim();
  const open = s.indexOf('{'), close = s.lastIndexOf('}');
  if (open !== -1 && close > open) s = s.slice(open, close + 1);
  try { return JSON.parse(s); }
  catch (e) {
    // Trailing commas are the one thing LLM output gets wrong often enough to fix.
    try { return JSON.parse(s.replace(/,\s*([}\]])/g, '$1')); }
    catch (_) { throw e; }
  }
}

function normalize(o) {
  const d = { ...o };
  if (typeof d.bullets === 'string') d.bullets = d.bullets.split('\n');
  if (!Array.isArray(d.bullets)) d.bullets = [];
  d.bullets = d.bullets.map((b) => String(b).replace(/^[-•*]\s*/, '').trim()).filter(Boolean);
  if (Array.isArray(d.caption)) d.caption = d.caption.join('\n\n');
  d.caption = d.caption == null ? '' : String(d.caption).trim();
  for (const k of ['category', 'headline', 'subtitle', 'eyebrow', 'heading', 'date', 'slug']) {
    if (d[k] != null) d[k] = String(d[k]).trim();
  }
  return d;
}

const slugify = (s) =>
  String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 48) || 'card';

/* ---- render -------------------------------------------------------- */
let fontsReady = false;
async function ensureFonts() {
  if (fontsReady) return;
  await Promise.all(FONT_SPECS.map((s) => document.fonts.load(s, 'Ag')));
  await document.fonts.ready;
  fontsReady = true;
}

function setStatus(key, cls = '', ...args) {
  statusState = { key, args, cls };
  const el = $('status');
  el.textContent = key ? t(key, ...args) : '';
  el.className = cls;
}

async function draw() {
  await ensureFonts();
  const raw = ta.value;
  localStorage.setItem(STORE, raw);

  if (!raw.trim()) { data = null; setStatus('waiting'); blank(); return; }
  try {
    data = normalize(parseJSON(raw));
  } catch (e) {
    setStatus(lastGood ? 'parseErrKept' : 'parseErr', 'err', e.message);
    if (!lastGood) { blank(); return; }
    data = lastGood;
    paint();
    return;
  }
  lastGood = data;
  setStatus('ready', 'ok', data.slug || slugify(data.headline));
  syncCaption();
  paint();
}

function blank() {
  data = null;
  for (const c of [c1, c2]) {
    const ctx = c.getContext('2d');
    c.width = 1080; c.height = 1350;
    ctx.fillStyle = '#121212'; ctx.fillRect(0, 0, 1080, 1350);
  }
  $('m1').textContent = $('m2').textContent = '';
  $('btn-download').disabled = true;
}

let fit1 = null, fit2 = null;
function paint() {
  const focus = +$('focus').value / 100;
  fit1 = renderPhotoCard(c1, data, { photo: photoImg, logo: logoImg, focus });
  fit2 = renderDarkCard(c2, data, { logo: logoImg });
  paintMeta();
  $('btn-download').disabled = false;
}

function paintMeta() {
  if (!fit1 || !fit2) return;
  $('m1').textContent = t('meta1', fit1.headline, fit1.subtitle) + (fit1.overflow ? t('meta1over') : '');
  $('m1').className = 'meta' + (fit1.overflow ? ' warn' : '');
  $('m2').textContent = t('meta2', fit2.heading, fit2.bullets) +
    (fit2.overflow ? t('meta2over', fit2.longest) : '');
  $('m2').className = 'meta' + (fit2.overflow ? ' warn' : '');
}

let timer;
ta.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(draw, 180); });

function setFocusLabel() {
  const v = +$('focus').value;
  $('focus-val').textContent = v === 50 ? t('focusCentre')
    : (v < 50 ? t('focusUp', 50 - v) : t('focusDown', v - 50));
}
$('focus').addEventListener('input', () => { setFocusLabel(); if (data) paint(); });

/* ---- caption ------------------------------------------------------- */
// Only overwrite the box when the JSON actually carries a different caption,
// so hand edits survive an unrelated re-parse.
function syncCaption() {
  const incoming = data.caption || '';
  if (incoming !== captionFromJSON) {
    captionFromJSON = incoming;
    cap.value = incoming;
  }
  refreshCaptionUI();
}

function refreshCaptionUI() {
  const text = cap.value.trim();
  const n = cap.value.length;
  $('count').textContent = t('chars', n);
  $('count').className = n > CAP_LIMIT ? 'over' : '';

  const problems = [];
  if (text) {
    if (n > CAP_LIMIT) problems.push(t('lintLong', n));
    if (!text.includes(SIGNOFF)) problems.push(t('lintSignoff'));
    if (!/^Photo:\s*\S+/m.test(text)) problems.push(t('lintPhoto'));
    if (/(^|\s)#[A-Za-z0-9]/.test(text)) problems.push(t('lintHash'));
    const hits = MARKETING.filter((w) => text.toLowerCase().includes(w));
    if (hits.length) problems.push(t('lintMarketing', hits.join(', ')));
    const body = text.split(/\n\s*\n/)
      .filter((p) => p.trim() && !p.includes(SIGNOFF) && !/^Photo:/.test(p.trim()));
    if (body.length && (body.length - 1 < 4 || body.length - 1 > 6)) {
      problems.push(t('lintParas', body.length - 1));
    }
  }
  $('lint').innerHTML = '';
  for (const p of problems) {
    const div = document.createElement('div');
    div.textContent = '· ' + p;
    $('lint').appendChild(div);
  }
}
cap.addEventListener('input', refreshCaptionUI);

/* ---- image intake -------------------------------------------------- */
function drawDropEmpty() {
  $('drop').innerHTML = `<strong>${t('dropMain')}</strong><span>${t('dropSub')}</span>`;
}
function drawDropLoaded() {
  $('drop').innerHTML = `<span>${t('dropLoaded', photoImg.width, photoImg.height)}</span>`;
}

async function useImage(blobOrFile) {
  if (!blobOrFile || !blobOrFile.type.startsWith('image/')) return;
  const url = URL.createObjectURL(blobOrFile);
  try {
    photoImg = await loadImage(url);
    $('drop').classList.add('has-img');
    $('drop').style.backgroundImage = `url(${url})`;
    drawDropLoaded();
    if (data) paint();
  } catch (_) { setStatus('imgFail', 'err'); }
}

function clearImage() {
  photoImg = null;
  $('drop').classList.remove('has-img');
  $('drop').style.backgroundImage = '';
  drawDropEmpty();
  if (data) paint();
}

$('drop').addEventListener('click', () => $('file').click());
$('drop').addEventListener('dragover', (e) => { e.preventDefault(); $('drop').classList.add('over'); });
$('drop').addEventListener('dragleave', () => $('drop').classList.remove('over'));
$('drop').addEventListener('drop', (e) => {
  e.preventDefault(); $('drop').classList.remove('over');
  useImage(e.dataTransfer.files[0]);
});
$('file').addEventListener('change', (e) => useImage(e.target.files[0]));
$('btn-clear-img').addEventListener('click', clearImage);

// Paste anywhere — including inside a text box, where an image paste carries
// no text and so must not be treated as typing.
window.addEventListener('paste', (e) => {
  const item = [...(e.clipboardData?.items || [])].find((i) => i.type.startsWith('image/'));
  if (item) { e.preventDefault(); useImage(item.getAsFile()); }
});

/* ---- export -------------------------------------------------------- */
const toBlob = (canvas) => new Promise((res) => canvas.toBlob(res, 'image/png'));

async function downloadBoth() {
  const slug = data.slug || slugify(data.headline);
  const names = [`${slug}-1-photo.png`, `${slug}-2-dark.png`];
  const canvases = [c1, c2];
  for (let i = 0; i < 2; i++) {
    const blob = await toBlob(canvases[i]);
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = names[i];
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    await new Promise((r) => setTimeout(r, 350));
  }
  setStatus('downloaded', 'ok', names[0], names[1]);
}

$('btn-download').addEventListener('click', () => {
  if (!data) return;
  downloadBoth().catch((e) => setStatus('downloadFail', 'err', e.message));
});

function flash(btn, key) {
  btn.textContent = t('copied');
  setTimeout(() => { btn.textContent = t(key); }, 1400);
}

document.querySelectorAll('[data-copy]').forEach((btn) => {
  btn.addEventListener('click', async () => {
    const canvas = btn.dataset.copy === '1' ? c1 : c2;
    try {
      if (!navigator.clipboard?.write) throw new Error(t('noClipboard'));
      await navigator.clipboard.write([new ClipboardItem({ 'image/png': await toBlob(canvas) })]);
      flash(btn, btn.dataset.i18n);
    } catch (e) { setStatus('copyFail', 'err', e.message); }
  });
});

async function copyText(text, btn, key) {
  try { await navigator.clipboard.writeText(text); flash(btn, key); }
  catch (_) { setStatus('copyTextFail', 'err'); }
}
$('btn-prompt').addEventListener('click', (e) => copyText(PROMPT, e.target, 'btnPrompt'));
$('btn-caption').addEventListener('click', (e) => copyText(cap.value, e.target, 'btnCopyCaption'));
$('btn-sample').addEventListener('click', () => {
  ta.value = JSON.stringify(SAMPLE, null, 2);
  draw();
});

/* ---- logo ---------------------------------------------------------- */
$('btn-logo').addEventListener('click', () => $('logofile').click());
$('logofile').addEventListener('change', async (e) => {
  const f = e.target.files[0];
  if (!f) return;
  logoImg = await loadImage(URL.createObjectURL(f));
  if (data) paint();
});
$('btn-logo-reset').addEventListener('click', async () => {
  logoImg = await loadImage(window.NDW_LOGO);
  if (data) paint();
});

/* ---- boot ---------------------------------------------------------- */
(async () => {
  const q = new URLSearchParams(location.search);
  if (q.get('lang') === 'zh' || q.get('lang') === 'en') lang = q.get('lang');
  $('brandmark').src = window.NDW_LOGO;
  logoImg = await loadImage(window.NDW_LOGO);
  ta.value = localStorage.getItem(STORE) || '';
  if (q.has('demo')) ta.value = JSON.stringify(SAMPLE, null, 2);
  applyLang();
  blank();
  await draw();
  ta.focus();
})();
</script>
