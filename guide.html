<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NY Daily Watch · Guide</title>
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="assets/fonts.css">
<style>
  :root{
    --ink:#121212; --panel:#1b1b1b; --line:#2e2e2e;
    --gold:#EFC050; --cream:#EADFC2; --text:#EDEDED; --dim:#9A9A9A;
    --bad:#E0655B; --ok:#7FBF7F;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--ink);color:var(--text);
    font:400 15px/1.7 'Montserrat',system-ui,'Microsoft YaHei',sans-serif;
    padding:28px clamp(16px,3vw,44px) 90px}
  .wrap{max-width:1180px;margin:0 auto}
  h1{font:700 30px/1.2 'Playfair Display',serif;color:var(--gold)}
  h2{font:700 26px/1.3 'Playfair Display',serif;color:var(--gold);margin:0 0 6px}
  h3{font:600 15px/1.4 'Montserrat';color:var(--cream);margin:22px 0 8px}
  header{display:flex;align-items:center;gap:14px;margin-bottom:8px;flex-wrap:wrap}
  header img{width:44px;height:44px;border-radius:50%}
  .spacer{margin-left:auto}
  .langs{display:flex;gap:6px}
  a.nav{color:var(--dim);text-decoration:none;font-size:13px;border:1px solid var(--line);
    border-radius:7px;padding:9px 14px}
  a.nav:hover{color:var(--gold);border-color:var(--gold)}
  button{font:600 13px/1 'Montserrat';border-radius:7px;padding:9px 14px;cursor:pointer;
    border:1px solid var(--line);background:#252525;color:var(--text)}
  button:hover{border-color:var(--gold);color:var(--gold)}
  button[aria-pressed=true]{border-color:var(--gold);color:var(--gold);background:#2b2416}

  .lede{color:var(--dim);font-size:14px;margin-bottom:26px;max-width:76ch}
  nav.toc{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:34px}
  nav.toc a{font-size:12.5px;color:var(--dim);text-decoration:none;border:1px solid var(--line);
    border-radius:20px;padding:6px 13px}
  nav.toc a:hover{color:var(--gold);border-color:var(--gold)}

  section{border-top:1px solid var(--line);padding-top:26px;margin-top:34px}
  section > p{max-width:76ch;color:#D8D6D0;margin-bottom:10px}
  .muted{color:var(--dim);font-size:13.5px}

  ol.steps{counter-reset:s;list-style:none;margin:14px 0 0;max-width:80ch}
  ol.steps li{counter-increment:s;position:relative;padding-left:46px;margin-bottom:16px}
  ol.steps li::before{content:counter(s);position:absolute;left:0;top:1px;width:30px;height:30px;
    border-radius:50%;background:var(--gold);color:#1a1400;font:700 14px/30px 'Montserrat';
    text-align:center}
  ol.steps b{color:var(--cream);font-weight:600}

  .figs{display:flex;flex-wrap:wrap;gap:22px;margin-top:18px;align-items:flex-start}
  figure{background:#0d0d0d;border:1px solid var(--line);border-radius:10px;padding:10px;
    display:inline-block}
  figure canvas,figure svg{display:block;border-radius:4px}
  figcaption{font-size:12px;color:var(--dim);margin-top:8px;max-width:230px;line-height:1.5}
  figcaption b{color:var(--cream);font-weight:600;display:block;margin-bottom:2px}

  table{border-collapse:collapse;margin-top:14px;font-size:13.5px;width:100%;max-width:900px}
  th,td{border-bottom:1px solid var(--line);padding:9px 12px;text-align:left;vertical-align:top}
  th{color:var(--dim);font:600 11.5px/1.4 'Montserrat';letter-spacing:.07em;text-transform:uppercase}
  td code{font-size:12.5px}
  code{background:#191919;border:1px solid var(--line);border-radius:4px;padding:1px 6px;font-size:12.5px}
  pre{background:#151515;border:1px solid var(--line);border-radius:8px;padding:14px 16px;
    overflow-x:auto;margin-top:12px;font:400 12.5px/1.6 ui-monospace,Consolas,monospace;
    color:#CFCDC6;max-width:900px}
  kbd{background:#2a2a2a;border:1px solid var(--line);border-radius:4px;padding:1px 6px;
    font:600 12px/1 'Montserrat';color:var(--cream)}
  .note{border-left:3px solid var(--gold);background:#1a1710;padding:12px 16px;border-radius:0 8px 8px 0;
    margin-top:16px;font-size:13.5px;color:#DED9CC;max-width:80ch}
  .note.bad{border-left-color:var(--bad);background:#1c1413}
  ul.plain{list-style:none;margin-top:10px;max-width:80ch}
  ul.plain li{padding-left:18px;position:relative;margin-bottom:7px;font-size:14px;color:#D8D6D0}
  ul.plain li::before{content:'·';position:absolute;left:4px;color:var(--gold);font-weight:700}
</style>
</head>
<body>
<div class="wrap">
<header>
  <img id="brandmark" alt="">
  <h1 data-i18n="appTitle"></h1>
  <span class="spacer"></span>
  <a class="nav" href="index.html" data-i18n="navPost"></a>
  <a class="nav" href="studio.html" data-i18n="navStudio"></a>
  <div class="langs">
    <button data-lang="en">English</button>
    <button data-lang="zh">中文</button>
  </div>
</header>
<p class="lede" data-i18n="lede"></p>

<nav class="toc" id="toc"></nav>

<section id="what">
  <h2 data-i18n="s1title"></h2>
  <p data-i18n="s1body"></p>
  <div class="figs" id="fig-outputs"></div>
</section>

<section id="flow">
  <h2 data-i18n="s2title"></h2>
  <p data-i18n="s2body"></p>
  <ol class="steps" id="flow-steps"></ol>
  <div class="figs"><figure><svg id="svg-layout" width="720" height="300"></svg>
    <figcaption><b data-i18n="figLayoutT"></b><span data-i18n="figLayoutC"></span></figcaption></figure></div>
  <div class="note" data-i18n="s2note"></div>
</section>

<section id="templates">
  <h2 data-i18n="s3title"></h2>
  <p data-i18n="s3body"></p>
  <div class="figs" id="fig-templates"></div>
</section>

<section id="caption">
  <h2 data-i18n="s9title"></h2>
  <p data-i18n="s9body"></p>
  <ul class="plain" id="caption-rules"></ul>
  <div class="note" data-i18n="s9note"></div>
</section>

<section id="charts">
  <h2 data-i18n="s4title"></h2>
  <p data-i18n="s4body"></p>
  <div class="figs" id="fig-charts"></div>
  <h3 data-i18n="s4fields"></h3>
  <pre id="chart-json"></pre>
  <table id="chart-fields"></table>
</section>

<section id="palette">
  <h2 data-i18n="s5title"></h2>
  <p data-i18n="s5body"></p>
  <div class="figs"><figure><svg id="svg-palette" width="700" height="130"></svg>
    <figcaption><b data-i18n="figPalT"></b><span data-i18n="figPalC"></span></figcaption></figure></div>
  <table id="palette-checks"></table>
  <div class="note" data-i18n="s5note"></div>
</section>

<section id="safe">
  <h2 data-i18n="s6title"></h2>
  <p data-i18n="s6body"></p>
  <div class="figs" id="fig-safe"></div>
</section>

<section id="video">
  <h2 data-i18n="s7title"></h2>
  <p data-i18n="s7body"></p>
  <div class="figs"><figure><svg id="svg-timeline" width="720" height="180"></svg>
    <figcaption><b data-i18n="figTimeT"></b><span data-i18n="figTimeC"></span></figcaption></figure></div>
  <div class="figs" id="fig-video"></div>
  <table id="video-opts"></table>
  <div class="note bad" data-i18n="s7note"></div>
</section>

<section id="fix">
  <h2 data-i18n="s8title"></h2>
  <table id="fixes"></table>
</section>
</div>

<script src="assets/logo.js"></script>

/* ---- illustration helpers -------------------------------------------- */
let logoImg = null;

function figure(parent, width, capKey, capPair) {
  const fig = document.createElement('figure');
  const c = document.createElement('canvas');
  c.style.width = width + 'px';
  fig.appendChild(c);
  const cap = document.createElement('figcaption');
  cap.dataset.cap = capKey || '';
  if (capPair) cap.innerHTML = `<b>${capPair[0]}</b>${capPair[1]}`;
  fig.appendChild(cap);
  parent.appendChild(fig);
  return c;
}

function fillFigs() {
  // Outputs
  const out = $('fig-outputs'); out.innerHTML = '';
  renderPhotoCard(figure(out, 190, null, t('capCard1')), CARD, { logo: logoImg });
  renderDarkCard(figure(out, 190, null, t('capCard2')), CARD, { logo: logoImg });
  renderPoster(figure(out, 150, null, t('capPoster')), POSTER, { logo: logoImg, ratio: '9:16' });
  renderChart(figure(out, 190, null, t('capChart')), CHARTS.bar, { logo: logoImg, ratio: '4:5' });

  // Templates, at a bigger size
  const tp = $('fig-templates'); tp.innerHTML = '';
  renderPhotoCard(figure(tp, 250, null, t('capCard1')), CARD, { logo: logoImg });
  renderDarkCard(figure(tp, 250, null, t('capCard2')), CARD, { logo: logoImg });
  renderPoster(figure(tp, 195, null, t('capPoster')), POSTER, { logo: logoImg, ratio: '4:5' });

  // Charts
  const ch = $('fig-charts'); ch.innerHTML = '';
  for (const [k, d] of Object.entries(CHARTS)) {
    renderChart(figure(ch, 215, null, t('chartCaps')[k]), d, { logo: logoImg, ratio: '4:5' });
  }

  // Safe zones
  const sf = $('fig-safe'); sf.innerHTML = '';
  renderPoster(figure(sf, 175, null, t('capSafe916')), POSTER, { logo: logoImg, ratio: '9:16', guides: true });
  renderPoster(figure(sf, 230, null, t('capSafe45')), POSTER, { logo: logoImg, ratio: '4:5', guides: true });

  // Video frames
  const vd = $('fig-video'); vd.innerHTML = '';
  const card = document.createElement('canvas');
  renderPhotoCard(card, CARD, { logo: logoImg });
  const slide = new Image();
  slide.onload = () => {
    const c1 = figure(vd, 150, null, t('capVidCard'));
    c1.width = V.W; c1.height = V.H;
    drawFrame(c1.getContext('2d'), [{ el: slide, kind: 'image', sub: t('subDemo') }], 1.2,
      { total: 6, intro: 0, outro: 0, motion: 'none', transition: 'crossfade' });
    const c2 = figure(vd, 150, null, t('capVidIntro'));
    c2.width = V.W; c2.height = V.H;
    drawIntro(c2.getContext('2d'), 1, { logo: logoImg, date: 'August 12, 2026' });
    const c3 = figure(vd, 150, null, t('capVidOutro'));
    c3.width = V.W; c3.height = V.H;
    drawOutro(c3.getContext('2d'), 1, { logo: logoImg });
  };
  slide.src = card.toDataURL();
}

/* ---- SVG diagrams ----------------------------------------------------- */
const NS = 'http://www.w3.org/2000/svg';
const el = (name, attrs, text) => {
  const n = document.createElementNS(NS, name);
  for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
  if (text != null) n.textContent = text;
  return n;
};

function drawLayout() {
  const svg = $('svg-layout');
  svg.innerHTML = '';
  const box = (x, y, w, h, label, gold) => {
    svg.appendChild(el('rect', { x, y, width: w, height: h, rx: 8, fill: gold ? '#2b2416' : '#1b1b1b',
      stroke: gold ? '#EFC050' : '#2e2e2e', 'stroke-width': 1.5 }));
    svg.appendChild(el('text', { x: x + 12, y: y + 24, fill: gold ? '#EFC050' : '#9A9A9A',
      'font-family': 'Montserrat', 'font-size': 13, 'font-weight': 600 }, label));
  };
  svg.appendChild(el('rect', { x: 0, y: 0, width: 720, height: 300, rx: 10, fill: '#121212' }));
  box(16, 16, 320, 120, lang === 'zh' ? '1 · 粘 JSON' : '1 · Story JSON', true);
  box(16, 148, 320, 66, lang === 'zh' ? '2 · Ctrl+V 贴图' : '2 · Ctrl+V the photo', true);
  box(16, 226, 320, 58, lang === 'zh' ? '3 · 下载两张 PNG' : '3 · Download both PNGs', true);
  box(356, 16, 170, 150, lang === 'zh' ? '卡片 1' : 'Card 1');
  box(538, 16, 166, 150, lang === 'zh' ? '卡片 2' : 'Card 2');
  box(356, 178, 348, 106, 'Caption');
  svg.appendChild(el('path', { d: 'M340 76 L352 76', stroke: '#EFC050', 'stroke-width': 2 }));
  svg.appendChild(el('path', { d: 'M340 76 L352 76 M347 71 L353 76 L347 81', stroke: '#EFC050',
    'stroke-width': 2, fill: 'none' }));
}

function drawPaletteFig() {
  const svg = $('svg-palette');
  svg.innerHTML = '';
  svg.appendChild(el('rect', { x: 0, y: 0, width: 700, height: 130, rx: 10, fill: '#121212' }));
  BRAND_PALETTE.forEach((hex, i) => {
    const x = 16 + i * 112;
    svg.appendChild(el('rect', { x, y: 22, width: 96, height: 52, rx: 7, fill: hex }));
    svg.appendChild(el('text', { x: x + 4, y: 96, fill: '#9A9A9A', 'font-family': 'Montserrat',
      'font-size': 12 }, `${i + 1} · ${hex}`));
  });
  svg.appendChild(el('text', { x: 16, y: 118, fill: '#7FBF7F', 'font-family': 'Montserrat',
    'font-size': 12 }, lang === 'zh'
    ? '✓ 全部通过：明度、彩度、色盲可辨性、对比度'
    : '✓ All checks pass: lightness, chroma, colourblind separation, contrast'));
}

function drawTimeline() {
  const svg = $('svg-timeline');
  svg.innerHTML = '';
  svg.appendChild(el('rect', { x: 0, y: 0, width: 720, height: 180, rx: 10, fill: '#121212' }));
  const total = 30, intro = 2, outro = 2.4;
  const body = total - intro - outro;
  const per = body / 3;
  const X = 24, W = 672, k = W / total;
  const seg = (start, len, fill, label, sub) => {
    const x = X + start * k, w = len * k;
    svg.appendChild(el('rect', { x, y: 46, width: w - 3, height: 56, rx: 6, fill }));
    svg.appendChild(el('text', { x: x + 8, y: 80, fill: '#1a1400', 'font-family': 'Montserrat',
      'font-size': 12, 'font-weight': 700 }, label));
    svg.appendChild(el('text', { x: x + 8, y: 122, fill: '#9A9A9A', 'font-family': 'Montserrat',
      'font-size': 11 }, sub));
  };
  seg(0, intro, '#8a7a4a', lang === 'zh' ? '片头' : 'Title', intro + 's');
  for (let i = 0; i < 3; i++) {
    seg(intro + i * per, per, '#EFC050',
      (lang === 'zh' ? '图 ' : 'Slide ') + (i + 1), per.toFixed(1) + 's');
  }
  seg(intro + body, outro, '#8a7a4a', lang === 'zh' ? '片尾' : 'End', outro + 's');
  svg.appendChild(el('text', { x: X, y: 32, fill: '#EADFC2', 'font-family': 'Montserrat',
    'font-size': 12, 'font-weight': 600 },
    lang === 'zh' ? '总长 30 秒 · 3 张图' : '30 seconds total · 3 slides'));
  svg.appendChild(el('text', { x: X, y: 158, fill: '#9A9A9A', 'font-family': 'Montserrat',
    'font-size': 11 }, lang === 'zh'
    ? '每两段之间有 0.6 秒交叉淡入' : 'A 0.6s crossfade sits between every pair'));
}

/* ---- tables ----------------------------------------------------------- */
function table(id, head, rows) {
  const el2 = $(id);
  el2.innerHTML = '<thead><tr>' + head.map((h) => `<th>${h}</th>`).join('') + '</tr></thead><tbody>' +
    rows.map((r) => '<tr>' + r.map((c, i) =>
      `<td>${i === 0 ? '<code>' + c + '</code>' : c}</td>`).join('') + '</tr>').join('') +
    '</tbody>';
}

/* ---- language --------------------------------------------------------- */
function applyLang() {
  document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
  document.title = t('appTitle');
  document.querySelectorAll('[data-i18n]').forEach((n) => { n.textContent = t(n.dataset.i18n); });
  document.querySelectorAll('[data-lang]').forEach((b) =>
    b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));

  const ids = ['what', 'flow', 'templates', 'caption', 'charts',
    'palette', 'safe', 'video', 'fix'];
  $('toc').innerHTML = t('toc').map((label, i) => `<a href="#${ids[i]}">${label}</a>`).join('');

  $('flow-steps').innerHTML = t('steps')
    .map(([head, body]) => `<li><b>${head}</b> ${body}</li>`).join('');
  $('caption-rules').innerHTML = t('captionRules').map((r) => `<li>${r}</li>`).join('');
  $('chart-json').textContent = CHART_JSON;
  table('chart-fields', t('chartFieldsHead'), t('chartFields'));
  table('video-opts', t('videoOptsHead'), t('videoOpts'));
  table('fixes', lang === 'zh' ? ['现象', '原因和解法'] : ['What you see', 'Why, and the fix'], t('fixes'));

  drawLayout(); drawPaletteFig(); drawTimeline();
  fillFigs();
}
document.querySelectorAll('[data-lang]').forEach((b) => b.addEventListener('click', () => {
  lang = b.dataset.lang;
  localStorage.setItem(LANG_STORE, lang);
  applyLang();
}));

})();
