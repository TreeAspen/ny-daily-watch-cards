<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NY Daily Watch · Studio</title>
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="assets/fonts.css">
<style>
  :root{
    --ink:#121212; --panel:#1b1b1b; --line:#2e2e2e;
    --gold:#EFC050; --cream:#EADFC2; --text:#EDEDED; --dim:#9A9A9A;
    --bad:#E0655B; --ok:#7FBF7F;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--ink);color:var(--text);
    font:400 15px/1.55 'Montserrat',system-ui,'Microsoft YaHei',sans-serif;
    padding:28px clamp(16px,3vw,44px) 64px}
  h1{font:700 27px/1.2 'Playfair Display',serif;color:var(--gold)}
  header{display:flex;align-items:center;gap:14px;margin-bottom:6px;flex-wrap:wrap}
  header img{width:44px;height:44px;border-radius:50%}
  .spacer{margin-left:auto}
  .langs{display:flex;gap:6px}
  .langs button{padding:7px 13px;font-size:12.5px}
  .langs button[aria-pressed=true]{border-color:var(--gold);color:var(--gold);background:#2b2416}
  a.nav{color:var(--dim);text-decoration:none;font-size:13px;border:1px solid var(--line);
    border-radius:7px;padding:9px 14px}
  a.nav:hover{color:var(--gold);border-color:var(--gold)}
  .lede{color:var(--dim);font-size:13.5px;margin-bottom:20px}
  .lede kbd{background:#2a2a2a;border:1px solid var(--line);border-radius:4px;
    padding:1px 6px;font:600 12px/1 'Montserrat';color:var(--cream)}

  .tabs{display:flex;gap:8px;border-bottom:1px solid var(--line);margin-bottom:22px;flex-wrap:wrap}
  .tabs button{background:none;border:none;border-bottom:2px solid transparent;border-radius:0;
    padding:12px 6px;margin-right:16px;color:var(--dim);font:600 14px/1 'Montserrat'}
  .tabs button:hover{color:var(--cream)}
  .tabs button[aria-selected=true]{color:var(--gold);border-bottom-color:var(--gold)}
  section[hidden]{display:none}

  .grid{display:grid;grid-template-columns:minmax(360px,1fr) minmax(320px,.9fr);
    gap:26px;align-items:start}
  @media (max-width:960px){.grid{grid-template-columns:1fr}}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px}
  .panel + .panel{margin-top:18px}
  .label{font:600 12px/1 'Montserrat';letter-spacing:.08em;text-transform:uppercase;
    color:var(--dim);margin-bottom:10px;display:flex;justify-content:space-between;
    align-items:center;gap:12px;flex-wrap:wrap}

  textarea{width:100%;resize:vertical;min-height:210px;background:#131313;color:var(--text);
    border:1px solid var(--line);border-radius:8px;padding:14px;
    font:400 13px/1.6 ui-monospace,'Cascadia Mono',Consolas,monospace;tab-size:2}
  textarea:focus{outline:none;border-color:var(--gold)}

  .seg{display:flex;gap:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;width:max-content}
  .seg button{border:none;border-radius:0;background:#202020;padding:10px 18px;font-weight:400}
  .seg button[aria-pressed=true]{background:var(--gold);color:#1a1400;font-weight:600}

  .drop{border:1.5px dashed #3d3d3d;border-radius:8px;min-height:120px;display:flex;
    flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;
    color:var(--dim);font-size:13px;text-align:center;padding:14px;transition:.15s;
    background-size:cover;background-position:center}
  .drop:hover,.drop.over{border-color:var(--gold);color:var(--cream)}
  .drop.has-img{border-style:solid;min-height:140px;color:transparent}
  .drop.has-img span{background:rgba(0,0,0,.62);color:#fff;padding:4px 10px;border-radius:5px}

  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .row.slider{margin-top:12px;font-size:12.5px;color:var(--dim)}
  input[type=range]{flex:1;accent-color:var(--gold)}
  input[type=number]{width:76px;background:#131313;color:var(--text);border:1px solid var(--line);
    border-radius:6px;padding:8px 10px;font:400 13px 'Montserrat'}
  select{background:#131313;color:var(--text);border:1px solid var(--line);border-radius:6px;
    padding:8px 10px;font:400 13px 'Montserrat';cursor:pointer}
  select:focus{outline:none;border-color:var(--gold)}
  .row label[for]{font-size:13px;color:var(--dim)}
  label.check{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--dim);cursor:pointer}
  label.check input{accent-color:var(--gold);width:16px;height:16px}

  button{font:600 13px/1 'Montserrat';border-radius:7px;padding:11px 16px;cursor:pointer;
    border:1px solid var(--line);background:#252525;color:var(--text);transition:.15s}
  button:hover{border-color:var(--gold);color:var(--gold)}
  button.primary{background:var(--gold);color:#1a1400;border-color:var(--gold)}
  button.primary:hover{filter:brightness(1.08);color:#1a1400}
  button.ghost{background:none;padding:8px 12px;font-weight:400;font-size:12.5px}
  button:disabled{opacity:.45;cursor:not-allowed}

  figure{background:#0d0d0d;border:1px solid var(--line);border-radius:10px;overflow:hidden;
    display:flex;justify-content:center}
  canvas{display:block;max-width:100%;height:auto}
  .tall canvas{max-height:560px;width:auto}
  .meta{font-size:11.5px;color:var(--dim);margin-top:8px;min-height:16px}
  .meta.warn{color:var(--bad)}
  .status{margin-top:12px;font-size:13px;min-height:20px}
  .status.err{color:var(--bad)}
  .status.ok{color:var(--ok)}

  .strip{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
  .strip:empty{margin:0}
  .thumb{position:relative;width:150px;border:1px solid var(--line);border-radius:8px;
    overflow:hidden;background:#0d0d0d;cursor:grab}
  .thumb.drag{opacity:.35}
  .thumb.target{border-color:var(--gold)}
  .thumb .shot{position:relative}
  .thumb img{display:block;width:100%;height:132px;object-fit:cover}
  .thumb .dur{position:absolute;right:5px;top:5px;background:rgba(0,0,0,.72);color:#EADFC2;
    font:600 10px/1 'Montserrat';padding:3px 5px;border-radius:3px}
  .thumb .cap{width:100%;border:none;border-top:1px solid var(--line);background:#151515;
    color:var(--text);padding:7px 8px;font:400 11.5px/1.4 'Montserrat';resize:none;
    display:block;min-height:34px}
  .thumb .cap:focus{outline:none;background:#1d1a12}
  .thumb .cap::placeholder{color:#6b6862}
  .thumb .cues{padding:0 8px 6px;font:400 10px/1.3 'Montserrat';color:var(--dim);background:#151515}
  .thumb .cues.tight{color:var(--bad)}
  .thumb .cues:empty{display:none}
  .thumb .n{position:absolute;top:5px;left:5px;background:var(--gold);color:#1a1400;
    font:700 11px/1 'Montserrat';padding:4px 7px;border-radius:4px}
  .thumb .x{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.66);border:none;
    color:#fff;padding:4px 7px;font-size:12px;border-radius:4px}
  .thumb .mv{position:absolute;bottom:0;left:0;right:0;display:flex;
    background:rgba(0,0,0,.62)}
  .thumb .shot .mv{bottom:0}
  .thumb .mv button{flex:1;border:none;border-radius:0;background:none;padding:5px;font-size:12px}

  .swatches{display:flex;flex-wrap:wrap;gap:10px}
  .chip{position:relative;width:64px;height:52px;border-radius:8px;border:1px solid var(--line);
    overflow:hidden;cursor:pointer}
  .chip input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;border:none}
  .chip .k{position:absolute;left:5px;bottom:3px;font:600 9.5px/1 'Montserrat';
    color:#000;background:rgba(255,255,255,.72);padding:2px 4px;border-radius:3px}
  .chip .x{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.5);border:none;color:#fff;
    padding:1px 4px;font-size:10px;border-radius:3px;line-height:1.2;opacity:.4;transition:.15s}
  .chip:hover .x{opacity:1}
  #k-check{margin-top:12px;font-size:12.5px;display:flex;flex-direction:column;gap:4px}
  #k-check:empty{margin:0}
  #k-check .pass{color:var(--ok)}
  #k-check .warn{color:var(--bad)}
  #k-figure canvas{max-height:600px;width:auto}
  progress{width:100%;height:8px;accent-color:var(--gold);margin-top:12px}
  .hint{font-size:12.5px;color:var(--dim);margin-top:10px}
  code{background:#131313;border:1px solid var(--line);border-radius:4px;padding:1px 5px;font-size:12px}
</style>
</head>
<body>
<header>
  <img id="brandmark" alt="">
  <h1 data-i18n="appTitle"></h1>
  <span class="spacer"></span>
  <a class="nav" href="index.html" data-i18n="navBack"></a>
  <a class="nav" href="guide.html" data-i18n="navGuide"></a>
  <div class="langs">
    <button data-lang="en">English</button>
    <button data-lang="zh">中文</button>
  </div>
</header>
<p class="lede" data-i18n-html="lede"></p>

<div class="tabs" role="tablist">
  <button role="tab" data-tab="single" data-i18n="tabSingle"></button>
  <button role="tab" data-tab="poster" data-i18n="tabPoster"></button>
  <button role="tab" data-tab="chart" data-i18n="tabChart"></button>
  <button role="tab" data-tab="video" data-i18n="tabVideo"></button>
</div>

<!-- ---------- single card ---------- -->
<section id="tab-single" hidden>
  <div class="grid">
    <div>
      <div class="panel">
        <div class="label"><span data-i18n="pickTemplate"></span></div>
        <div class="seg" id="tpl">
          <button data-tpl="photo" data-i18n="tplPhoto"></button>
          <button data-tpl="dark" data-i18n="tplDark"></button>
        </div>
        <p class="hint" id="tpl-hint"></p>
      </div>

      <div class="panel">
        <div class="label"><span data-i18n="stepJson"></span><span class="row">
          <button class="ghost" id="s-prompt" data-i18n="btnPrompt"></button>
          <button class="ghost" id="s-sample" data-i18n="btnSample"></button></span></div>
        <textarea id="s-json" spellcheck="false"></textarea>
      </div>

      <div class="panel" id="s-photo-panel">
        <div class="label"><span data-i18n="stepPhoto"></span><span class="row">
          <button class="ghost" id="s-clear" data-i18n="btnClearImg"></button></span></div>
        <div class="drop" id="s-drop" tabindex="0"></div>
        <input type="file" id="s-file" accept="image/*" hidden>
        <div class="row slider">
          <label for="s-focus" data-i18n="focusLabel"></label>
          <input type="range" id="s-focus" min="0" max="100" value="50">
          <span id="s-focus-val"></span>
        </div>
      </div>
    </div>

    <div>
      <figure><canvas id="s-canvas"></canvas></figure>
      <div class="meta" id="s-meta"></div>
      <div class="row" style="margin-top:12px">
        <button class="primary" id="s-download" data-i18n="btnDownloadPng"></button>
        <button id="s-copy" data-i18n="btnCopyPng"></button>
      </div>
      <div class="status" id="s-status"></div>
    </div>
  </div>
</section>

<!-- ---------- poster ---------- -->
<section id="tab-poster" hidden>
  <div class="grid">
    <div>
      <div class="panel">
        <div class="label"><span data-i18n="stepJson"></span><span class="row">
          <button class="ghost" id="p-prompt" data-i18n="btnPrompt"></button>
          <button class="ghost" id="p-sample" data-i18n="btnSample"></button></span></div>
        <textarea id="p-json" spellcheck="false"></textarea>
      </div>

      <div class="panel">
        <div class="label"><span data-i18n="stepPhoto"></span><span class="row">
          <button class="ghost" id="p-clear" data-i18n="btnClearImg"></button></span></div>
        <div class="drop" id="p-drop" tabindex="0"></div>
        <input type="file" id="p-file" accept="image/*" hidden>
        <div class="row slider">
          <label for="p-focus" data-i18n="focusLabel"></label>
          <input type="range" id="p-focus" min="0" max="100" value="50">
          <span id="p-focus-val"></span>
        </div>
        <div class="row" style="margin-top:14px">
          <label for="p-ratio" data-i18n="ratioLabel"></label>
          <div class="seg" id="p-ratio">
            <button data-ratio="9:16">9:16</button>
            <button data-ratio="4:5">4:5</button>
            <button data-ratio="16:9">16:9</button>
          </div>
        </div>
        <div class="row" style="margin-top:14px">
          <label class="check"><input type="checkbox" id="p-guides">
            <span data-i18n="showGuides"></span></label>
        </div>
        <p class="hint" data-i18n="safeNote"></p>
      </div>
    </div>

    <div>
      <figure class="tall"><canvas id="p-canvas"></canvas></figure>
      <div class="meta" id="p-meta"></div>
      <div class="row" style="margin-top:12px">
        <button class="primary" id="p-download" data-i18n="btnDownloadPng"></button>
        <button id="p-copy" data-i18n="btnCopyPng"></button>
      </div>
      <div class="status" id="p-status"></div>
    </div>
  </div>
</section>

<!-- ---------- chart ---------- -->
<section id="tab-chart" hidden>
  <div class="grid">
    <div>
      <div class="panel">
        <div class="label"><span data-i18n="stepData"></span><span class="row">
          <button class="ghost" id="k-prompt" data-i18n="btnPrompt"></button>
          <button class="ghost" id="k-sample" data-i18n="btnSample"></button></span></div>
        <textarea id="k-json" spellcheck="false"></textarea>
      </div>

      <div class="panel">
        <div class="label"><span data-i18n="stepFormat"></span></div>
        <div class="row">
          <label for="k-ratio" data-i18n="ratioLabel"></label>
          <div class="seg" id="k-ratio">
            <button data-ratio="4:5">4:5</button>
            <button data-ratio="9:16">9:16</button>
            <button data-ratio="16:9">16:9</button>
          </div>
        </div>
        <div class="row" style="margin-top:14px">
          <label for="k-type" data-i18n="typeLabel"></label>
          <select id="k-type"></select>
          <label class="check"><input type="checkbox" id="k-values" checked>
            <span data-i18n="valueLabels"></span></label>
        </div>
        <p class="hint" id="k-type-hint"></p>
      </div>

      <div class="panel">
        <div class="label"><span data-i18n="stepPalette"></span><span class="row">
          <button class="ghost" id="k-add" data-i18n="btnAddColour"></button>
          <button class="ghost" id="k-reset" data-i18n="btnResetPalette"></button></span></div>
        <div class="swatches" id="k-swatches"></div>
        <div id="k-check"></div>
        <p class="hint" data-i18n="paletteNote"></p>
      </div>
    </div>

    <div>
      <figure id="k-figure"><canvas id="k-canvas"></canvas></figure>
      <div class="meta" id="k-meta"></div>
      <div class="row" style="margin-top:12px">
        <button class="primary" id="k-download" data-i18n="btnDownloadPng"></button>
        <button id="k-copy" data-i18n="btnCopyPng"></button>
      </div>
      <div class="status" id="k-status"></div>
    </div>
  </div>
</section>

<!-- ---------- video ---------- -->
<section id="tab-video" hidden>
  <div class="grid">
    <div>
      <div class="panel">
        <div class="label"><span data-i18n="stepSlides"></span><span class="row">
          <button class="ghost" id="v-clear" data-i18n="btnClearAll"></button></span></div>
        <div class="drop" id="v-drop" tabindex="0"></div>
        <input type="file" id="v-file" accept="image/*,video/*" multiple hidden>
        <progress id="v-load" value="0" max="1" hidden></progress>
        <div class="hint" id="v-load-label" hidden></div>
        <div class="strip" id="v-strip"></div>
      </div>

      <div class="panel">
        <div class="label"><span data-i18n="stepTiming"></span></div>
        <div class="row">
          <label for="v-secs" style="font-size:13px;color:var(--dim)" data-i18n="totalSecs"></label>
          <input type="number" id="v-secs" min="6" max="90" step="1" value="30">
          <span id="v-per" style="font-size:12.5px;color:var(--dim)"></span>
        </div>
        <div class="row" style="margin-top:14px">
          <label class="check"><input type="checkbox" id="v-intro" checked>
            <span data-i18n="withIntro"></span></label>
          <label class="check"><input type="checkbox" id="v-outro" checked>
            <span data-i18n="withOutro"></span></label>
          <label class="check"><input type="checkbox" id="v-audio" checked>
            <span data-i18n="keepAudio"></span></label>
        </div>
        <div class="row" style="margin-top:14px">
          <label for="v-motion" data-i18n="motionLabel"></label>
          <select id="v-motion"></select>
          <label for="v-trans" data-i18n="transLabel"></label>
          <select id="v-trans"></select>
        </div>
        <div class="row slider">
          <label for="v-scrub" data-i18n="scrub"></label>
          <input type="range" id="v-scrub" min="0" max="1000" value="0">
          <button class="ghost" id="v-play" data-i18n="btnPlay"></button>
        </div>
      </div>

      <div class="panel">
        <div class="label"><span data-i18n="stepRender"></span></div>
        <div class="row">
          <button class="primary" id="v-render" data-i18n="btnRender"></button>
          <button id="v-cancel" data-i18n="btnCancel" hidden></button>
        </div>
        <progress id="v-prog" value="0" max="1" hidden></progress>
        <div class="status" id="v-status"></div>
        <p class="hint" data-i18n-html="renderNote"></p>
      </div>
    </div>

    <div>
      <figure class="tall"><canvas id="v-canvas"></canvas></figure>
      <div class="meta" id="v-meta"></div>
    </div>
  </div>
</section>

<script src="assets/logo.js"></script>

/* ---- shared helpers ------------------------------------------------- */
let logoImg = null, fontsReady = false;

async function ensureFonts() {
  if (fontsReady) return;
  await Promise.all(FONT_SPECS.map((s) => document.fonts.load(s, 'Ag')));
  await document.fonts.ready;
  fontsReady = true;
}

function parseJSON(raw) {
  let s = raw.trim();
  if (!s) return null;
  s = s.replace(/^```(?:json)?\s*/i, '').replace(/```\s*$/, '').trim();
  const open = s.indexOf('{'), close = s.lastIndexOf('}');
  if (open !== -1 && close > open) s = s.slice(open, close + 1);
  try { return JSON.parse(s); }
  catch (e) {
    try { return JSON.parse(s.replace(/,\s*([}\]])/g, '$1')); }
    catch (_) { throw e; }
  }
}

function normalize(o) {
  const d = { ...o };
  if (typeof d.bullets === 'string') d.bullets = d.bullets.split('\n');
  if (Array.isArray(d.bullets)) {
    d.bullets = d.bullets.map((b) => String(b).replace(/^[-•*]\s*/, '').trim()).filter(Boolean);
  }
  return d;
}

const slugify = (s) =>
  String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 48) || 'card';

const toBlob = (canvas) => new Promise((res) => canvas.toBlob(res, 'image/png'));

function saveBlob(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 6000);
}

function status(el, key, cls = '', ...args) {
  el.dataset.key = key; el.dataset.args = JSON.stringify(args);
  el.textContent = key ? t(key, ...args) : '';
  el.className = 'status ' + cls;
}
function restatus(el) {
  if (el.dataset.key) el.textContent = t(el.dataset.key, ...JSON.parse(el.dataset.args || '[]'));
}

function flash(btn, key) {
  btn.textContent = t('copied');
  setTimeout(() => { btn.textContent = t(key); }, 1400);
}

async function copyCanvas(canvas, btn, key, statusEl) {
  try {
    if (!navigator.clipboard?.write) throw new Error('clipboard');
    await navigator.clipboard.write([new ClipboardItem({ 'image/png': await toBlob(canvas) })]);
    flash(btn, key);
  } catch (e) { status(statusEl, 'copyFail', 'err', e.message); }
}

async function copyText(text, btn, key) {
  try { await navigator.clipboard.writeText(text); flash(btn, key); } catch (_) {}
}

/* Wires one click/drag/file drop zone. Paste is routed globally by tab. */
function wireDrop(dropEl, fileEl, onImage) {
  dropEl.addEventListener('click', () => fileEl.click());
  dropEl.addEventListener('dragover', (e) => { e.preventDefault(); dropEl.classList.add('over'); });
  dropEl.addEventListener('dragleave', () => dropEl.classList.remove('over'));
  dropEl.addEventListener('drop', (e) => {
    e.preventDefault(); dropEl.classList.remove('over');
    onImage([...e.dataTransfer.files].filter((f) => f.type.startsWith('image/')));
  });
  fileEl.addEventListener('change', (e) => onImage([...e.target.files]));
}

const single = { tpl: 'photo', photo: null, data: null, fit: null };

function singleDropText() {
  if (single.photo) return `<span>${t('dropLoaded', single.photo.width, single.photo.height)}</span>`;
  return `<strong>${t('dropMain')}</strong><span>${t('dropSubBand')}</span>`;
}

function paintSingle() {
  const c = $('s-canvas');
  if (!single.data) {
    c.width = 1080; c.height = 1350;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#121212'; ctx.fillRect(0, 0, 1080, 1350);
    $('s-meta').textContent = '';
    $('s-download').disabled = $('s-copy').disabled = true;
    return;
  }
  const focus = +$('s-focus').value / 100;
  single.fit = single.tpl === 'photo'
    ? renderPhotoCard(c, single.data, { photo: single.photo, logo: logoImg, focus })
    : renderDarkCard(c, single.data, { logo: logoImg });
  const f = single.fit;
  const a = single.tpl === 'photo' ? f.headline : f.heading;
  const b = single.tpl === 'photo' ? f.subtitle : f.bullets;
  $('s-meta').textContent = t('metaCard', a, b) + (f.overflow ? t('metaOver') : '');
  $('s-meta').className = 'meta' + (f.overflow ? ' warn' : '');
  $('s-download').disabled = $('s-copy').disabled = false;
}

async function readSingle() {
  await ensureFonts();
  const raw = $('s-json').value;
  localStorage.setItem(STORE.single, raw);
  if (!raw.trim()) { single.data = null; status($('s-status'), 'waiting'); paintSingle(); return; }
  try { single.data = normalize(parseJSON(raw)); }
  catch (e) { status($('s-status'), 'parseErr', 'err', e.message); return; }
  status($('s-status'), 'ready', 'ok', single.data.slug || slugify(single.data.headline || single.data.heading));
  paintSingle();
}

function setTemplate(tpl) {
  single.tpl = tpl;
  document.querySelectorAll('#tpl button').forEach((b) =>
    b.setAttribute('aria-pressed', String(b.dataset.tpl === tpl)));
  $('s-photo-panel').hidden = tpl !== 'photo';
  $('tpl-hint').textContent = tpl === 'photo' ? t('hintPhoto') : t('hintDark');
  paintSingle();
}

document.querySelectorAll('#tpl button').forEach((b) =>
  b.addEventListener('click', () => setTemplate(b.dataset.tpl)));

let sTimer;
$('s-json').addEventListener('input', () => { clearTimeout(sTimer); sTimer = setTimeout(readSingle, 180); });
$('s-focus').addEventListener('input', () => {
  $('s-focus-val').textContent = focusText($('s-focus').value);
  paintSingle();

const video = { slides: [], playing: false, recording: false, raf: 0, mime: pickMime() };

const INTRO_S = 2.0, OUTRO_S = 2.4;
const videoOpts = () => ({
  total: +$('v-secs').value,
  fade: 0.6,
  motion: $('v-motion').value,
  transition: $('v-trans').value,
  audio: $('v-audio').checked,
  intro: $('v-intro').checked ? INTRO_S : 0,
  outro: $('v-outro').checked ? OUTRO_S : 0,
  brand: {
    logo: logoImg,
    wordmark: 'NY DAILY WATCH',
    handle: '@theNYdailywatch',
    date: poster.data?.date || single.data?.date || '',
    tail: 'LINK IN BIO',
  },
});

/* The running time is the plan's, not the number in the box: a cut fitted to
   long footage sets its own length. */
const plannedTotal = () => planTimeline(video.slides, videoOpts()).total;

function paintVideoAt(frac) {
  const ctx = $('v-canvas').getContext('2d');
  const o = videoOpts();
  const total = planTimeline(video.slides, o).total;
  // Scrubbing seeks the clips; playing lets them run. Same frames either way.
  if (video.slides.length) syncClips(video.slides, frac * total, o, { live: video.playing });
  // With nothing loaded, hold the finished opening title rather than a black
  // frame, so the tab shows what it makes.
  if (!video.slides.length) {
    ctx.fillStyle = '#121212'; ctx.fillRect(0, 0, V.W, V.H);
    if (o.intro) drawIntro(ctx, 1, o.brand);
    return;
  }
  drawFrame(ctx, video.slides, frac * total, o);
}

const clock = (n) => (n >= 60
  ? Math.floor(n / 60) + ':' + String(Math.round(n % 60)).padStart(2, '0') + ''
  : n.toFixed(0) + 's');
const secs = (n) => (n >= 60 ? Math.floor(n / 60) + ':' + String(Math.round(n % 60)).padStart(2, '0')
  : n.toFixed(1) + 's');

function renderStrip() {
  const strip = $('v-strip');
  strip.innerHTML = '';
  video.slides.forEach((slide, i) => {
    const d = document.createElement('div');
    d.className = 'thumb';
    d.draggable = true;
    d.dataset.i = i;
    const dur = slide.kind === 'video' && slide.dur
      ? `<span class="dur">▶ ${secs(slide.dur)}</span>` : '';
    d.innerHTML =
      `<div class="shot"><img src="${slide.thumb || ''}" alt=""><span class="n">${i + 1}</span>` +
      dur +
      `<button class="x" data-act="del">✕</button>` +
      `<span class="mv"><button data-act="left">◀</button><button data-act="right">▶</button></span></div>` +
      `<textarea class="cap" data-sub="${i}" rows="2" draggable="false" spellcheck="false"></textarea>` +
      `<div class="cues" data-cues="${i}"></div>`;
    const cap = d.querySelector('.cap');
    cap.value = slide.sub || '';
    cap.placeholder = t('subPlaceholder');
    strip.appendChild(d);
  });
  paintCueInfo();
  updateVideoMeta();
}

/* One line per cue, so the seconds each one gets are worth showing — a cue
   under the floor is one nobody can finish reading. */
function paintCueInfo() {
  const plan = planTimeline(video.slides, videoOpts());
  document.querySelectorAll('#v-strip .cues').forEach((el) => {
    const i = +el.dataset.cues;
    const slide = video.slides[i];
    const cues = cuesOf(slide);
    if (cues.length < 2) { el.textContent = ''; el.className = 'cues'; return; }
    const spans = cueSpans(cues, plan.spans[i] || 1);
    const min = Math.min(...spans);
    el.textContent = t('cueCount', cues.length, min.toFixed(1));
    el.className = 'cues' + (min < MIN_CUE - 0.01 ? ' tight' : '');
  });
}

/* Subtitles are typed straight onto the strip, so the words stay attached to
   the picture they belong to. */
$('v-strip').addEventListener('input', (e) => {
  const i = e.target.dataset.sub;
  if (i == null) return;
  video.slides[+i].sub = e.target.value;
  // Grow the box with the cues rather than making people scroll a 2-line field.
  e.target.style.height = 'auto';
  e.target.style.height = Math.min(96, e.target.scrollHeight) + 'px';
  paintCueInfo();
  paintVideoAt(+$('v-scrub').value / 1000);
});

function move(from, to) {
  if (to < 0 || to >= video.slides.length) return;
  const [x] = video.slides.splice(from, 1);
  video.slides.splice(to, 0, x);
  renderStrip();
  paintVideoAt(+$('v-scrub').value / 1000);
}

$('v-strip').addEventListener('click', (e) => {
  const act = e.target.dataset.act;
  if (!act) return;
  const i = +e.target.closest('.thumb').dataset.i;
  if (act === 'del') { video.slides.splice(i, 1); renderStrip(); paintVideoAt(+$('v-scrub').value / 1000); }
  if (act === 'left') move(i, i - 1);
  if (act === 'right') move(i, i + 1);
});

let dragFrom = null;
$('v-strip').addEventListener('dragstart', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') {
    e.preventDefault(); return;
  }
  const th = e.target.closest('.thumb');
  if (!th) return;
  dragFrom = +th.dataset.i;
  th.classList.add('drag');
  e.dataTransfer.effectAllowed = 'move';
});
$('v-strip').addEventListener('dragend', () => {
  dragFrom = null;
  document.querySelectorAll('.thumb').forEach((n) => n.classList.remove('drag', 'target'));
});
$('v-strip').addEventListener('dragover', (e) => {
  if (dragFrom === null) return;
  e.preventDefault();
  const th = e.target.closest('.thumb');
  document.querySelectorAll('.thumb').forEach((n) => n.classList.remove('target'));
  if (th) th.classList.add('target');
});
$('v-strip').addEventListener('drop', (e) => {
  const th = e.target.closest('.thumb');
  if (dragFrom === null || !th) return;
  e.preventDefault();
  e.stopPropagation();
  move(dragFrom, +th.dataset.i);
  dragFrom = null;
});

function updateVideoMeta() {
  const n = video.slides.length;
  const o = videoOpts();
  const plan = planTimeline(video.slides, o);
  const clips = video.slides.filter((s) => s.kind === 'video').length;

  // Footage a minute or longer takes the running time out of the box's hands,
  // so the box stops pretending to be in charge of it.
  $('v-secs').disabled = plan.fitted;
  if (plan.fitted) $('v-secs').value = Math.round(plan.total);

  $('v-per').textContent = !n ? t('noSlides')
    : plan.fitted
      ? t('fitted', clock(plan.total), STILL_SECS)
      : t('perSlide', n, (plan.body / n).toFixed(1)) +
        (clips ? ' · ' + t('clipNote', clips) : '');
  paintCueInfo();
  $('v-meta').textContent = video.mime ? t('videoMeta', video.mime, n) : t('noRecorder');
  $('v-render').disabled = !n || !video.mime || video.recording;
}

/* A clip is loaded far enough to have a frame, then one frame is pulled off it
   for the strip — a <video> cannot be used as a thumbnail directly. */
/* Nothing is uploaded anywhere — the file stays in the page — but a long clip
   still takes a visible moment to open, decode and thumbnail, so the steps it
   really goes through are reported rather than a timer pretending to be one. */
function loadClip(file, onStage) {
  return new Promise((resolve, reject) => {
    const el = document.createElement('video');
    el.preload = 'auto';
    el.muted = true;              // unmuted only while recording, through the audio graph
    el.playsInline = true;
    el.loop = true;               // a short clip fills its slot instead of freezing
    onStage?.(0.05, 'stage_open');
    el.onloadedmetadata = () => onStage?.(0.3, 'stage_meta');
    el.onprogress = () => {
      // Real buffered fraction when the browser reports one; it never invents.
      try {
        const b = el.buffered;
        if (b.length && el.duration) {
          onStage?.(0.3 + 0.35 * Math.min(1, b.end(b.length - 1) / el.duration), 'stage_buffer');
        }
      } catch (_) { /* buffered can throw before metadata */ }
    };
    el.onloadeddata = () => { onStage?.(0.7, 'stage_frame'); resolve(el); };
    el.onerror = () => reject(new Error('clip'));
    el.src = URL.createObjectURL(file);
    setTimeout(() => reject(new Error('clip')), 60000);
  });
}

function clipThumb(el) {
  return new Promise((resolve) => {
    const grab = () => {
      const c = document.createElement('canvas');
      c.width = el.videoWidth; c.height = el.videoHeight;
      c.getContext('2d').drawImage(el, 0, 0);
      el.onseeked = null;
      try { resolve(c.toDataURL('image/jpeg', 0.7)); } catch (_) { resolve(''); }
    };
    el.onseeked = grab;
    try { el.currentTime = Math.min(0.15, (el.duration || 1) / 3); }
    catch (_) { grab(); }
    setTimeout(grab, 2500);
  });
}

function showProgress(frac, label) {
  $('v-load').hidden = $('v-load-label').hidden = false;
  $('v-load').value = Math.max(0, Math.min(1, frac));
  $('v-load-label').textContent = label;
}
function hideProgress() {
  $('v-load').hidden = $('v-load-label').hidden = true;
}

async function addSlides(files) {
  const list = [...files].filter((f) =>
    f.type.startsWith('image/') || f.type.startsWith('video/'));
  if (!list.length) return;

  for (let i = 0; i < list.length; i++) {
    const f = list[i];
    // The bar spans the whole batch; each file owns one slice of it.
    const at = (frac, stage) =>
      showProgress((i + frac) / list.length,
        t('adding', i + 1, list.length, f.name) + ' — ' + t(stage));
    at(0, 'stage_open');
    try {
      if (f.type.startsWith('video/')) {
        const el = await loadClip(f, at);
        at(0.8, 'stage_thumb');
        const thumb = await clipThumb(el);
        // The file is kept so the offline export can read its audio track.
        video.slides.push({ el, file: f, kind: 'video', sub: '', thumb, dur: el.duration || 0 });
      } else {
        const el = await loadImage(URL.createObjectURL(f));
        at(0.9, 'stage_thumb');
        video.slides.push({ el, kind: 'image', sub: '', thumb: el.src, dur: 0 });
      }
      at(1, 'stage_done');
      renderStrip();                     // each one appears as it lands
    } catch (_) {
      status($('v-status'), f.type.startsWith('video/') ? 'clipFail' : 'imgFail', 'err');
    }
  }
  hideProgress();
  renderStrip();
  paintVideoAt(+$('v-scrub').value / 1000);
}
wireDrop($('v-drop'), $('v-file'), addSlides);

$('v-clear').addEventListener('click', () => {
  video.slides = [];
  renderStrip();
  paintVideoAt(0);
});

for (const id of ['v-secs', 'v-intro', 'v-outro', 'v-motion', 'v-trans', 'v-audio']) {
  $(id).addEventListener('input', () => { updateVideoMeta(); paintVideoAt(+$('v-scrub').value / 1000); });
}
$('v-scrub').addEventListener('input', () => { stopPlay(); paintVideoAt(+$('v-scrub').value / 1000); });

function stopPlay() {
  video.playing = false;
  cancelAnimationFrame(video.raf);
  if (video.slides.length) resetClips(video.slides);
  $('v-play').textContent = t('btnPlay');
}

$('v-play').addEventListener('click', () => {
  if (video.playing) { stopPlay(); return; }
  if (!video.slides.length) return;
  video.playing = true;
  $('v-play').textContent = t('btnPause');
  const total = plannedTotal();
  const started = performance.now() - (+$('v-scrub').value / 1000) * total * 1000;
  const tick = () => {
    if (!video.playing) return;
    const el = (performance.now() - started) / 1000;
    if (el >= total) { $('v-scrub').value = 0; paintVideoAt(0); stopPlay(); return; }
    $('v-scrub').value = Math.round((el / total) * 1000);
    paintVideoAt(el / total);
    video.raf = requestAnimationFrame(tick);
  };
  video.raf = requestAnimationFrame(tick);
});

$('v-render').addEventListener('click', async () => {
  if (!video.slides.length || !video.mime) return;
  stopPlay();
  video.recording = true;
  $('v-render').disabled = true;
  $('v-cancel').hidden = false;
  $('v-prog').hidden = false;
  const o = videoOpts();
  const runFor = plannedTotal();
  const frames = Math.round(runFor * V.fps);
  const started = performance.now();
  // Encode offline where the browser can; fall back to capturing the canvas in
  // real time where it cannot.
  const offline = await offlineSupported();
  const run = offline ? exportVideo : recordVideo;
  try {
    const { blob, ext, mime, cancelled } = await run(
      $('v-canvas'), video.slides, o,
      (p) => {
        $('v-prog').value = p;
        if (offline) status($('v-status'), 'encoding', '', Math.round(p * frames), frames);
        else status($('v-status'), 'recording', '', (p * runFor).toFixed(1), runFor.toFixed(0));
      },
      () => !video.recording,
    );
    if (cancelled) {
      status($('v-status'), 'cancelled', '');
    } else {
      const name = `ndw-reel-${new Date().toISOString().slice(0, 10)}.${ext}`;
      saveBlob(blob, name);
      status($('v-status'), 'rendered', 'ok', name, (blob.size / 1048576).toFixed(1),
        ((performance.now() - started) / 1000).toFixed(0));
      if (!mime.startsWith('video/mp4')) setTimeout(() => status($('v-status'), 'webmWarn', 'err'), 2200);
    }
  } catch (e) {
    status($('v-status'), e.message === 'no-recorder' ? 'noRecorder' : 'imgFail', 'err');
  } finally {
    video.recording = false;
    $('v-cancel').hidden = true;
    $('v-prog').hidden = true;
    updateVideoMeta();
  }
});
$('v-cancel').addEventListener('click', () => { video.recording = false; });

/* ---- tab : chart ------------------------------------------------------ */
const chart = { data: null, ratio: '4:5', palette: [...BRAND_PALETTE], fit: null };

function paintChart() {
  const c = $('k-canvas');
  if (!chart.data) {
    const [W, H] = RATIOS[chart.ratio];
    c.width = W; c.height = H;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#121212'; ctx.fillRect(0, 0, W, H);
    $('k-meta').textContent = '';
    $('k-download').disabled = $('k-copy').disabled = true;
    return;
  }
  const d = { ...chart.data, type: $('k-type').value, valueLabels: $('k-values').checked };
  chart.fit = renderChart(c, d, { palette: chart.palette, ratio: chart.ratio, logo: logoImg });

  const warn = chart.fit.warnings.map((w) => t('warn_' + w.code, ...Object.values(w).slice(1)));
  $('k-meta').textContent = t('chartMeta', t('type_' + d.type).split(' \u2014')[0],
    chart.fit.W, chart.fit.H, chart.fit.series) + (warn.length ? ' \u00b7 ' + warn.join(' ') : '');
  $('k-meta').className = 'meta' + (warn.length ? ' warn' : '');
  $('k-download').disabled = $('k-copy').disabled = false;
}

async function readChart() {
  await ensureFonts();
  const raw = $('k-json').value;
  localStorage.setItem(STORE.chart, raw);
  if (!raw.trim()) { chart.data = null; status($('k-status'), 'waiting'); paintChart(); return; }
  try { chart.data = normalize(parseJSON(raw)); }
  catch (e) { status($('k-status'), 'parseErr', 'err', e.message); return; }
  // The JSON may name its own chart type; the picker follows it.
  if (chart.data.type && CHART_TYPES.includes(chart.data.type)) $('k-type').value = chart.data.type;
  setTypeHint();
  status($('k-status'), 'ready', 'ok', chart.data.slug || slugify(chart.data.title));
  paintChart();
}

function setTypeHint() { $('k-type-hint').textContent = t('hint_' + $('k-type').value); }

/* Same checks the brand palette was picked with, run on whatever is in the
   swatch row \u2014 so a hand-added colour cannot quietly break the chart. */
function checkPalette() {
  const box = $('k-check');
  box.innerHTML = '';
  if (chart.palette.length < 2) return;
  const r = validate(chart.palette, { mode: 'dark', surface: '#121212' });
  const KEY = {
    'Lightness band': 'check_lightness', 'Chroma floor': 'check_chroma',
    'CVD separation': 'check_cvd', 'Normal-vision floor': 'check_normal',
    'Contrast vs surface': 'check_contrast',
  };
  const bad = r.report.filter(([, state]) => state === false || state === 'fail'
    || state === 'floor' || state === 'relief');
  if (!bad.length) {
    const el = document.createElement('div');
    el.className = 'pass'; el.textContent = '\u2713 ' + t('checkPass');
    box.appendChild(el);
    return;
  }
  for (const [name, , detail] of bad) {
    const el = document.createElement('div');
    el.className = 'warn';
    el.textContent = '\u00b7 ' + t(KEY[name]) + (detail ? ' \u2014 ' + detail : '');
    box.appendChild(el);
  }
}

function renderSwatches() {
  const box = $('k-swatches');
  box.innerHTML = '';
  chart.palette.forEach((hex, i) => {
    const chip = document.createElement('div');
    chip.className = 'chip';
    chip.style.background = hex;
    chip.innerHTML = '<input type="color" value="' + hex + '" data-i="' + i + '">' +
      '<span class="k">' + (i + 1) + '</span>' +
      (chart.palette.length > 1 ? '<button class="x" data-del="' + i + '">\u2715</button>' : '');
    box.appendChild(chip);
  });
  localStorage.setItem(STORE.palette, JSON.stringify(chart.palette));
  checkPalette();
}

$('k-swatches').addEventListener('input', (e) => {
  const i = e.target.dataset.i;
  if (i == null) return;
  chart.palette[+i] = e.target.value.toUpperCase();
  renderSwatches();
  paintChart();
});
$('k-swatches').addEventListener('click', (e) => {
  const i = e.target.dataset.del;
  if (i == null) return;
  chart.palette.splice(+i, 1);
  renderSwatches();
  paintChart();
});
$('k-add').addEventListener('click', () => {
  chart.palette.push(BRAND_PALETTE[chart.palette.length % BRAND_PALETTE.length]);
  renderSwatches();
  paintChart();
});
$('k-reset').addEventListener('click', () => {
  chart.palette = [...BRAND_PALETTE];
  renderSwatches();
  paintChart();
});

let kTimer;
$('k-json').addEventListener('input', () => { clearTimeout(kTimer); kTimer = setTimeout(readChart, 180); });
$('k-type').addEventListener('change', () => { setTypeHint(); paintChart(); });
$('k-values').addEventListener('change', paintChart);
document.querySelectorAll('#k-ratio button').forEach((b) => b.addEventListener('click', () => {
  chart.ratio = b.dataset.ratio;
  document.querySelectorAll('#k-ratio button').forEach((x) =>
    x.setAttribute('aria-pressed', String(x.dataset.ratio === chart.ratio)));
  paintChart();
}));
$('k-prompt').addEventListener('click', (e) => copyText(PROMPTS.chart, e.target, 'btnPrompt'));
$('k-sample').addEventListener('click', () => {
  // The stat tile needs a different shape of story, so it gets its own sample.
  const src = $('k-type').value === 'stat' ? SAMPLES.stat : SAMPLES.chart;
  $('k-json').value = JSON.stringify(src, null, 2);
  readChart();
});
$('k-download').addEventListener('click', async () => {
  const base = chart.data.slug || slugify(chart.data.title);
  const name = base + '-chart-' + chart.ratio.replace(':', 'x') + '.png';
  saveBlob(await toBlob($('k-canvas')), name);
  status($('k-status'), 'saved', 'ok', name);
});
$('k-copy').addEventListener('click', (e) => copyCanvas($('k-canvas'), e.target, 'btnCopyPng', $('k-status')));

/* ---- tabs, paste, language ------------------------------------------ */
let tab = 'single';
function setTab(name) {
  tab = name;
  for (const n of ['single', 'poster', 'chart', 'video']) $('tab-' + n).hidden = n !== name;
  document.querySelectorAll('[data-tab]').forEach((b) =>
    b.setAttribute('aria-selected', String(b.dataset.tab === name)));
  if (name !== 'video') stopPlay();
  location.hash = name;
}
document.querySelectorAll('[data-tab]').forEach((b) =>
  b.addEventListener('click', () => setTab(b.dataset.tab)));

// One paste handler for the page; the open tab decides where the image goes.
window.addEventListener('paste', (e) => {
  const files = [...(e.clipboardData?.items || [])]
    .filter((i) => i.type.startsWith('image/')).map((i) => i.getAsFile()).filter(Boolean);
  if (!files.length) return;
  e.preventDefault();
  if (tab === 'video') addSlides(files);
  else if (tab === 'poster') setPosterPhoto(files);
  else if (tab === 'single') setSinglePhoto(files);   // the chart tab takes no image
});

/* Options carry translated labels, so they are rebuilt on a language switch —
   keeping whatever was selected. */
function fillSelect(el, values, prefix, fallback) {
  const keep = el.value || fallback;
  el.innerHTML = '';
  for (const v of values) {
    const o = document.createElement('option');
    o.value = v; o.textContent = t(prefix + v);
    el.appendChild(o);
  }
  el.value = keep;
}

const focusText = (v) => {
  v = +v;
  return v === 50 ? t('focusCentre') : (v < 50 ? t('focusUp', 50 - v) : t('focusDown', v - 50));
};

function applyLang() {
  document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
  document.title = t('appTitle');
  document.querySelectorAll('[data-i18n]').forEach((el) => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-html]').forEach((el) => { el.innerHTML = t(el.dataset.i18nHtml); });
  document.querySelectorAll('[data-lang]').forEach((b) =>
    b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
  $('s-json').placeholder = $('p-json').placeholder = t('jsonPlaceholder');
  $('s-drop').innerHTML = singleDropText();
  $('p-drop').innerHTML = posterDropText();
  $('v-drop').innerHTML = `<strong>${t('dropSlides')}</strong><span>${t('dropSlidesSub')}</span>`;
  $('s-focus-val').textContent = focusText($('s-focus').value);
  $('p-focus-val').textContent = focusText($('p-focus').value);
  $('tpl-hint').textContent = single.tpl === 'photo' ? t('hintPhoto') : t('hintDark');
  $('v-play').textContent = video.playing ? t('btnPause') : t('btnPlay');
  document.querySelectorAll('#v-strip .cap').forEach((n) => { n.placeholder = t('subPlaceholder'); });
  paintCueInfo();
  fillSelect($('v-motion'), MOTIONS, 'motion_', 'alternate');
  fillSelect($('v-trans'), TRANSITIONS, 'trans_', 'crossfade');
  fillSelect($('k-type'), CHART_TYPES, 'type_', 'bar');
  setTypeHint();
  checkPalette();
  ['s-status', 'p-status', 'v-status'].forEach((id) => restatus($(id)));
  updateVideoMeta();
  if (single.data) paintSingle();
  if (poster.data) paintPoster();
  if (chart.data) paintChart();
}
document.querySelectorAll('[data-lang]').forEach((b) => b.addEventListener('click', () => {
  lang = b.dataset.lang;
  localStorage.setItem(LANG_STORE, lang);
  applyLang();
}));

/* ---- boot ------------------------------------------------------------ */
(async () => {
  const q = new URLSearchParams(location.search);
  if (q.get('lang') === 'zh' || q.get('lang') === 'en') lang = q.get('lang');
  $('brandmark').src = window.NDW_LOGO;
  logoImg = await loadImage(window.NDW_LOGO);

  $('v-canvas').width = V.W; $('v-canvas').height = V.H;
  $('s-json').value = localStorage.getItem(STORE.single) || '';
  $('p-json').value = localStorage.getItem(STORE.poster) || '';
  $('k-json').value = localStorage.getItem(STORE.chart) || '';
  try {
    const saved = JSON.parse(localStorage.getItem(STORE.palette) || 'null');
    if (Array.isArray(saved) && saved.length) chart.palette = saved;
  } catch (_) { /* a corrupt entry just falls back to the brand palette */ }
  if (q.has('demo')) {
    $('s-json').value = JSON.stringify(SAMPLES.photo, null, 2);
    $('p-json').value = JSON.stringify(SAMPLES.poster, null, 2);
    $('k-json').value = JSON.stringify(SAMPLES.chart, null, 2);
  }

  setTemplate('photo');
  for (const [id, val] of [['p-ratio', poster.ratio], ['k-ratio', chart.ratio]]) {
    document.querySelectorAll('#' + id + ' button').forEach((b) =>
      b.setAttribute('aria-pressed', String(b.dataset.ratio === val)));
  }
  renderSwatches();
  applyLang();
  setTab(['single', 'poster', 'chart', 'video'].includes(location.hash.slice(1))
    ? location.hash.slice(1) : 'single');
  await ensureFonts();
  await readSingle();
  await readPoster();
  await readChart();
  paintVideoAt(0);
})();
</script>
</body>
</html>
